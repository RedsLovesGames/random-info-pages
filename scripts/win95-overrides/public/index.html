<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#008080" />
  <meta name="application-name" content="RANDOM INFO OS" />
  <meta name="description" content="Random Info Pages inside an authentic React Windows 95-style shell." />
  <base target="_parent">
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" type="image/x-icon">
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>Random Info OS</title>
  <script>
    window.addEventListener('load', () => {
      addEventListener('mousemove', (event) => {
        window.parent.postMessage({ clientX: event.clientX, clientY: event.clientY, type: 'mousemove' }, '*');
      });
      addEventListener('mousedown', () => window.parent.postMessage({ type: 'mousedown' }, '*'));
      addEventListener('mouseup', () => window.parent.postMessage({ type: 'mouseup' }, '*'));
      addEventListener('keydown', (event) => window.parent.postMessage({ type: 'keydown', key: event.key }, '*'));
      addEventListener('keyup', (event) => window.parent.postMessage({ type: 'keyup', key: event.key }, '*'));
    });
  </script>
  <script src="%PUBLIC_URL%/js-dos/js-dos.js"></script>
  <link rel="stylesheet" href="%PUBLIC_URL%/js-dos/js-dos.css">
  <script>
    emulators.pathPrefix = "%PUBLIC_URL%/js-dos/";
  </script>
</head>
<body>
  <noscript>You need to enable JavaScript to run Random Info OS.</noscript>
  <div class="font_preload" style="opacity:0;position:absolute;pointer-events:none" aria-hidden="true">
    <span style="font-family:'MSSerif',Arial,sans-serif">abcdefghijklmnopqrstuvwxzy</span>
    <span style="font-family:'Millennium',Arial,sans-serif">abcdefghijklmnopqrstuvwxzy</span>
    <span style="font-family:'MillenniumBold',Arial,sans-serif">abcdefghijklmnopqrstuvwxzy</span>
    <span style="font-family:'Terminal',Arial,sans-serif">abcdefghijklmnopqrstuvwxzy</span>
  </div>
  <div id="root"></div>
</body>
</html>
