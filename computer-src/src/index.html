<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <title>Random Info Computer</title>
  <meta name="title" content="Random Info Computer">
  <meta name="description" content="An immersive 3D CRT entrance to Random Info Pages.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Random Info Computer">
  <meta property="og:description" content="An immersive 3D CRT entrance to Random Info Pages.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Random Info Computer">
  <meta name="twitter:description" content="An immersive 3D CRT entrance to Random Info Pages.">
  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">
</head>

<body>
  <div id="computer-fallback" hidden role="alert">
    <div class="computer-fallback-card">
      <p class="computer-fallback-kicker">RIP / ARCHIVE TERMINAL</p>
      <h1>3D COMPUTER UNAVAILABLE</h1>
      <p>This browser could not start the WebGL archive. The local computer interface and normal archive are still available.</p>
      <div class="computer-fallback-actions">
        <a href="../os/">Open Random Info OS</a>
        <a href="../">Back to archive</a>
      </div>
    </div>
  </div>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
