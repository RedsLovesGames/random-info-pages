name: Depths UI Ocean Font Rasterizer

on:
  push:
    branches: [ temp-depths-ui-build ]

jobs:
  fonts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download licensed Ocean font sources
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/depths-fonts/ocean /tmp/depths-fonts/ocean2
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://dl.dafont.com/dl/?f=ocean' -o /tmp/depths-fonts/ocean.zip
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0' 'https://dl.dafont.com/dl/?f=ocean_2' -o /tmp/depths-fonts/ocean2.zip
          unzip -oq /tmp/depths-fonts/ocean.zip -d /tmp/depths-fonts/ocean
          unzip -oq /tmp/depths-fonts/ocean2.zip -d /tmp/depths-fonts/ocean2
          OCEAN=$(find /tmp/depths-fonts/ocean -type f \( -iname '*.ttf' -o -iname '*.otf' \) | head -1)
          OCEAN2=$(find /tmp/depths-fonts/ocean2 -type f \( -iname '*.ttf' -o -iname '*.otf' \) | head -1)
          test -n "$OCEAN"; test -n "$OCEAN2"
          echo "OCEAN_FILE=$OCEAN" >> "$GITHUB_ENV"
          echo "OCEAN2_FILE=$OCEAN2" >> "$GITHUB_ENV"

      - name: Rasterize Minecraft bitmap atlases
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow fonttools
          mkdir -p output
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from fontTools.ttLib import TTFont

          ocean=Path(os.environ['OCEAN_FILE'])
          ocean2=Path(os.environ['OCEAN2_FILE'])
          out=Path('output')

          def info(path):
              tt=TTFont(str(path),lazy=True)
              cmap=set((tt.getBestCmap() or {}).keys())
              names=[]
              for rec in tt['name'].names:
                  if rec.nameID in (1,2,4,6):
                      try:s=rec.toUnicode().strip()
                      except Exception:continue
                      if s and s not in names:names.append(s)
              tt.close()
              return names,cmap

          n1,c1=info(ocean); n2,c2=info(ocean2)
          print('Ocean:',n1)
          print('Ocean 2:',n2)
          (out/'FONT_METADATA.txt').write_text('Ocean: '+repr(n1)+'\nOcean 2: '+repr(n2)+'\n',encoding='utf-8')

          rows=[" !\"#$%&'()*+,-./","0123456789:;<=>?","@ABCDEFGHIJKLMNO","PQRSTUVWXYZ[\\]^_","`abcdefghijklmno","pqrstuvwxyz{|}~•"]
          assert all(len(r)==16 for r in rows)

          def atlas(primary,fallback,primary_map,dest,size,cw,ch,baseline_ratio):
              img=Image.new('RGBA',(cw*16,ch*6),(0,0,0,0)); d=ImageDraw.Draw(img); cache={}
              def getfont(path,n):
                  key=(str(path),n)
                  if key not in cache: cache[key]=ImageFont.truetype(str(path),n)
                  return cache[key]
              for ri,row in enumerate(rows):
                  for ci,c in enumerate(row):
                      if c==' ': continue
                      src=primary if ord(c) in primary_map else fallback
                      if src is None: continue
                      n=size
                      while True:
                          f=getfont(src,n)
                          try: box=d.textbbox((0,0),c,font=f,anchor='ls')
                          except Exception: box=d.textbbox((0,0),c,font=f)
                          l,t,r,b=box
                          if ((r-l)<=cw-8 and (b-t)<=ch-8) or n<=12: break
                          n-=1
                      x0=ci*cw; y0=ri*ch; baseline=int(ch*baseline_ratio)
                      try:
                          l,t,r,b=d.textbbox((0,0),c,font=f,anchor='ls')
                          x=x0+(cw-(r-l))//2-l; y=y0+baseline
                          d.text((x,y),c,font=f,fill=(255,255,255,255),anchor='ls')
                      except Exception:
                          l,t,r,b=d.textbbox((0,0),c,font=f)
                          x=x0+(cw-(r-l))//2-l; y=y0+(ch-(b-t))//2-t
                          d.text((x,y),c,font=f,fill=(255,255,255,255))
              img.save(dest,optimize=True)

          atlas(ocean,None,c1,out/'ocean_ui.png',34,48,60,.76)
          atlas(ocean,None,c1,out/'ocean_display.png',38,52,64,.76)
          atlas(ocean2,ocean,c2,out/'ocean2_accent.png',38,60,72,.72)
          PY
          test -s output/ocean_ui.png
          test -s output/ocean_display.png
          test -s output/ocean2_accent.png
          if find output -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) | grep -q .; then exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: depths-ui-ocean-font-atlases
          path: output/
          if-no-files-found: error
