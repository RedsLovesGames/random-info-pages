name: Depths UI Gradle Runtime Export

on:
  push:
    branches: [ temp-depths-ui-build ]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Pack Gradle runtime
        shell: bash
        run: |
          GRADLE_BIN="$(command -v gradle)"
          GRADLE_HOME="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          echo "Gradle home: $GRADLE_HOME"
          gradle --version
          tar -C "$(dirname "$GRADLE_HOME")" -czf gradle-9.5.1-runtime.tgz "$(basename "$GRADLE_HOME")"
          ls -lh gradle-9.5.1-runtime.tgz
      - name: Upload Gradle runtime
        uses: actions/upload-artifact@v4
        with:
          name: gradle-9.5.1-runtime
          path: gradle-9.5.1-runtime.tgz
          compression-level: 0
          if-no-files-found: error
