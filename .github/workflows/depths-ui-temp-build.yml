name: Depths UI 0.4 Build

on:
  push:
    branches: [ temp-depths-ui-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Extract 0.4 source
        shell: bash
        run: |
          cd depths-ui-build
          cat v04chunk00 v04chunk01 v04chunk02 > v04source.b64
          test "$(wc -c < v04source.b64)" -eq 33036
          echo '8692c7e97c235c592a0fb2141a7afc1f8fa271a8c46bd9da3837c421d8045e7e  v04source.b64' | sha256sum -c -
          base64 -d v04source.b64 > v04source.tgz
          echo '75ac4f65d7c126f7d4bcf1843c3f6789427990f463e90e9d184e7e687837f4a1  v04source.tgz' | sha256sum -c -
          tar -xzf v04source.tgz
      - name: Build
        working-directory: depths-ui-build
        run: gradle clean build --stacktrace --no-daemon
      - name: Inspect runtime jar
        shell: bash
        run: |
          JAR="depths-ui-build/build/libs/the-depths-ui-0.4.0.jar"
          test -f "$JAR"
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/screen/DepthsTitleScreen.class'
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/screen/DepthsWorldSelectScreen.class'
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/screen/DepthsModsScreen.class'
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/screen/DepthsPauseScreen.class'
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/util/DepthsModIconCache.class'
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/util/DepthsTypography.class'
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/mixin/HudSuppressMixin.class'
          unzip -p "$JAR" the_depths_ui.client.mixins.json | grep -q 'HudSuppressMixin'
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: the-depths-ui-0.4.0-built
          path: depths-ui-build/build/libs/*.jar
          if-no-files-found: error
