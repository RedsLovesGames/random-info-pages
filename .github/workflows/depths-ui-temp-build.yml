name: Depths UI Temp Build

on:
  push:
    branches: [ temp-depths-ui-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Extract source
        shell: bash
        run: |
          cd depths-ui-build
          echo '9e1fa65a02b22c5292740581775a44dcca167100c568a73884f02efdbdb68b0d  chunk05a' | sha256sum -c -
          echo 'baa5bcf34788503f0016a2bdbb1d8f27707010da360eb44ed1b34bdd5236b75e  chunk05b' | sha256sum -c -
          echo 'a45a21a1ba1ac0db5bef34159805e8739eff7aa5737449fa7f62dbeafe12d5d9  chunk05c' | sha256sum -c -
          cat chunk00 chunk01 chunk02 chunk03 chunk04 chunk05a chunk05b chunk05c chunk06 chunk07 chunk08 chunk09 > source.b64
          test "$(wc -c < source.b64)" -eq 29428
          echo 'b6f3a5aada6a1da8c58aa8bd4eb8d94c663a0a819507ad97a70ec4159420a9b8  source.b64' | sha256sum -c -
          base64 -d source.b64 > source.tgz
          echo '1e6563d36c13ffe4d50d1de4140631654a1b36efa009b944705802cf6de08673  source.tgz' | sha256sum -c -
          tar -xzf source.tgz
      - name: Build
        working-directory: depths-ui-build
        run: gradle build --stacktrace --no-daemon
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: the-depths-ui-0.2.0-built
          path: depths-ui-build/build/libs/*.jar
          if-no-files-found: error
