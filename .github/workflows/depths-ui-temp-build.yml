name: Depths UI Temp Build

on:
  push:
    branches: [ temp-depths-ui-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Extract source
        shell: bash
        run: |
          cd depths-ui-build
          cat chunk00 chunk01 chunk02 chunk03 chunk04 chunk05a chunk05b chunk05c chunk06 chunk07 chunk08 chunk09 > source.b64
          test "$(wc -c < source.b64)" -eq 29428
          echo 'b6f3a5aada6a1da8c58aa8bd4eb8d94c663a0a819507ad97a70ec4159420a9b8  source.b64' | sha256sum -c -
          base64 -d source.b64 > source.tgz
          echo '1e6563d36c13ffe4d50d1de4140631654a1b36efa009b944705802cf6de08673  source.tgz' | sha256sum -c -
          tar -xzf source.tgz
      - name: Apply 0.3.0 cleanup and compile fixes
        shell: python
        run: |
          from pathlib import Path
          import json
          root = Path('depths-ui-build')

          p = root/'src/client/java/com/redgames/depthsui/widget/DepthsButton.java'
          s = p.read_text()
          if 'NarrationElementOutput' not in s:
              s = s.replace('import net.minecraft.client.gui.components.AbstractButton;\n', 'import net.minecraft.client.gui.components.AbstractButton;\nimport net.minecraft.client.gui.narration.NarrationElementOutput;\n')
          needle = '    @Override\n    public void onPress() {'
          if 'updateWidgetNarration' not in s:
              s = s.replace(needle, '    @Override\n    protected void updateWidgetNarration(NarrationElementOutput output) {\n        this.defaultButtonNarrationText(output);\n    }\n\n' + needle)
          p.write_text(s)

          p = root/'gradle.properties'
          p.write_text(p.read_text().replace('mod_version=0.2.0', 'mod_version=0.3.0'))

          p = root/'src/client/java/com/redgames/depthsui/screen/DepthsScreen.java'
          s = p.read_text()
          marker = '    protected void drawScene(GuiGraphics g) {'
          override = '''    @Override\n    public void renderBackground(GuiGraphics graphics, int mouseX, int mouseY, float partialTick) {\n        // Depths screens render their own crisp background.\n    }\n\n'''
          if 'void renderBackground(' not in s:
              s = s.replace(marker, override + marker)
          p.write_text(s)

          p = root/'src/client/java/com/redgames/depthsui/screen/DepthsTitleScreen.java'
          p.write_text(p.read_text().replace('FABRIC 1.21.1  •  UI 0.2', 'FABRIC 1.21.1  •  UI 0.3'))

          for rel in [
              'src/client/java/com/redgames/depthsui/util/LoadingOverlayRenderer.java',
              'src/client/java/com/redgames/depthsui/mixin/LoadingOverlayMixin.java',
              'src/client/java/com/redgames/depthsui/mixin/LevelLoadingScreenMixin.java',
              'src/client/java/com/redgames/depthsui/mixin/ReceivingLevelScreenMixin.java',
              'src/client/java/com/redgames/depthsui/mixin/SettingsBackgroundMixin.java',
          ]:
              q = root/rel
              if q.exists(): q.unlink()

          # Remove the unused legacy mc() helper from the final runtime too.
          p = root/'src/client/java/com/redgames/depthsui/util/DepthsTheme.java'
          s = p.read_text()
          s = s.replace('import net.minecraft.client.Minecraft;\n', '')
          s = s.replace('\n    public static Minecraft mc() {\n        return Minecraft.getInstance();\n    }\n', '\n')
          p.write_text(s)

          mix = root/'src/client/resources/the_depths_ui.client.mixins.json'
          mix.write_text(json.dumps({
              'required': True,
              'package': 'com.redgames.depthsui.mixin',
              'compatibilityLevel': 'JAVA_21',
              'client': ['MinecraftScreenRedirectMixin', 'CreateWorldScreenInvoker'],
              'injectors': {'defaultRequire': 1}
          }, indent=2) + '\n')

          assert 'void renderBackground(' in (root/'src/client/java/com/redgames/depthsui/screen/DepthsScreen.java').read_text()
          assert 'mod_version=0.3.0' in (root/'gradle.properties').read_text()
          assert 'public static Minecraft mc()' not in (root/'src/client/java/com/redgames/depthsui/util/DepthsTheme.java').read_text()
          assert json.loads(mix.read_text())['client'] == ['MinecraftScreenRedirectMixin', 'CreateWorldScreenInvoker']
      - name: Build
        working-directory: depths-ui-build
        run: gradle clean build --stacktrace --no-daemon
      - name: Inspect runtime jar
        shell: bash
        run: |
          JAR="depths-ui-build/build/libs/the-depths-ui-0.3.0.jar"
          test -f "$JAR"
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/screen/DepthsTitleScreen.class'
          unzip -l "$JAR" | grep -q 'com/redgames/depthsui/screen/DepthsScreen.class'
          unzip -l "$JAR" | grep -q 'the_depths_ui.client.mixins.json'
          if unzip -l "$JAR" | grep -q 'LoadingOverlayMixin.class'; then exit 1; fi
          if unzip -l "$JAR" | grep -q 'SettingsBackgroundMixin.class'; then exit 1; fi
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: the-depths-ui-0.3.0-built-clean-final
          path: depths-ui-build/build/libs/*.jar
          if-no-files-found: error
