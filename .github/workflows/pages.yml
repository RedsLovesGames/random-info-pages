          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/device-worlds-v2.js "$base/device-worlds/v2.mjs"
          grep -Fq 'createSignalStore' /tmp/device-worlds-v2.js
