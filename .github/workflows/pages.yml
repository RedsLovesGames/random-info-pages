name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Tideborne fish index
        run: python3 scripts/build_tideborne_fish_index.py

      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          if [ -f _site/wanuiv2/v21.html.gz.b64 ]; then
            base64 --decode _site/wanuiv2/v21.html.gz.b64 | gzip --decompress > _site/wanuiv2/index.html
          fi
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check school schedule
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            "$base/school-schedule/" | grep -Fq 'Fall 2026 School Schedule'
