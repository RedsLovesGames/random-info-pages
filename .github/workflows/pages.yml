name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node for Random Info Computer
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: computer-src/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify archive home
        run: |
          node --test tests/home-index.test.mjs
          grep -Fq 'data-archive-home' index.html
          grep -Fq 'id="searchDialog"' index.html
          grep -Fq 'data-folder="tools"' index.html
          grep -Fq 'data-folder="experiments"' index.html

      - name: Verify VCT comp lab and tactical planner
        run: |
          node --test vct-scout/recommendation.test.cjs
          node --test vct-scout/map-geometry.test.cjs
          node --test vct-scout/agent-tactics.test.cjs
          node --test vct-scout/recommended-plays.test.cjs
          node --test vct-scout/observed-rounds.test.cjs
          node --test vct-scout/tactical-renderer-v3.test.cjs
          node --check vct-scout/recommendation.js
          node --check vct-scout/app-core.js
          node --check vct-scout/app-lab.js
          node --check vct-scout/map-geometry.js
          node --check vct-scout/agent-tactics.js
          node --check vct-scout/recommended-plays.js
          node --check vct-scout/observed-rounds.js
          node --check vct-scout/tactical-renderer-v3.js
          grep -Fq 'Recommended Play' vct-scout/index.html
          grep -Fq 'Observed VCT Round' vct-scout/index.html
          grep -Fq 'tactical-renderer-v3.js' vct-scout/index.html
          grep -Fq 'tactical-renderer-v3.css' vct-scout/index.html
          if grep -Eq 'tactical-v2|tactical-fixes-v3' vct-scout/index.html; then
            echo 'Legacy tactical renderer is still referenced by the page'
            exit 1
          fi

      - name: Verify wheel
        run: |
          node --test wheel/*.test.mjs
          for f in wheel/*.js; do node --check "$f"; done
          grep -Fq './styles.css' wheel/index.html
          grep -Fq './app.js' wheel/index.html
          grep -Fq './wheel/' index.html

      - name: Refresh public VCT team logos
        run: |
          python3 scripts/update_vct_branding.py
          python3 - <<'PY'
          import json
          p=json.load(open('vct-scout/team-logos.json',encoding='utf-8'))
          print(f'Generated {len(p)} VCT team logos')
          if len(p) < 12:
              raise SystemExit('Too few team logos were resolved from VLR')
          PY

      - name: Build Tideborne fish index
        run: python3 scripts/build_tideborne_fish_index.py

      - name: Install Random Info Computer dependencies
        working-directory: computer-src
        run: npm ci

      - name: Build Random Info Computer
        working-directory: computer-src
        run: npm run build

      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'computer-src' \
            --exclude '_computer-smoke-site' \
            ./ _site/
          mkdir -p _site/computer
          cp -a computer-src/public/. _site/computer/
          touch _site/.nojekyll

      - name: Verify staged Random Info Computer
        run: |
          test -f _site/computer/index.html
          test -f _site/os/index.html
          find _site/computer -maxdepth 1 -name 'bundle.*.js' | grep -q .
          test ! -e _site/computer-src/node_modules
          grep -Fq 'computer-fallback' _site/computer/index.html
          grep -Fq 'RANDOM INFO OS' _site/os/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check archive home
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/home.html "$base/"
          grep -Fq 'data-archive-home' /tmp/home.html
          grep -Fq 'id="searchDialog"' /tmp/home.html
          grep -Fq './wheel/' /tmp/home.html
          grep -Fq './friends/' /tmp/home.html

      - name: Check Random Info Computer
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/computer.html "$base/computer/"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/os.html "$base/os/"
          grep -Fq 'computer-fallback' /tmp/computer.html
          grep -Fq 'RANDOM INFO OS' /tmp/os.html

      - name: Check school schedule
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/school.html "$base/school-schedule/"
          grep -Fq 'Fall 2026 School Schedule' /tmp/school.html

      - name: Check wheel
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wheel.html "$base/wheel/"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wheel-app.js "$base/wheel/app.js"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wheel-css.css "$base/wheel/styles.css"
          grep -Fq 'Wheel · Random Info Pages' /tmp/wheel.html
          grep -Fq 'id="entriesInput"' /tmp/wheel.html
          grep -Fq 'pickWeightedEntry' /tmp/wheel-app.js
          grep -Fq '.wheel-stage' /tmp/wheel-css.css
          grep -Fq '.side-panel' /tmp/wheel-css.css

      - name: Check VCT tactical planner
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/vct.html "$base/vct-scout/"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/v3.js "$base/vct-scout/tactical-renderer-v3.js"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/team-logos.json "$base/vct-scout/team-logos.json"
          grep -Fq 'Our Comp Lab' /tmp/vct.html
          grep -Fq 'Recommended Play' /tmp/vct.html
          grep -Fq 'Observed VCT Round' /tmp/vct.html
          grep -Fq 'buildModel' /tmp/v3.js
          grep -Fq '"120"' /tmp/team-logos.json
