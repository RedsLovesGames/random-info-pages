name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node for Random Info Computer
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: computer-src/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Towers of Babble playable dictionary
        run: |
          node tools/words/build-dictionary.mjs
          test -s tools/words/dictionaries/towers-of-babble.txt

      - name: Build standalone offline Word Finder
        run: |
          node tools/words/build-offline.mjs
          test -s tools/words/offline.html
          grep -Fq 'id="embeddedDictionary"' tools/words/offline.html

      - name: Verify archive home
        run: |
          node --test tests/home-index.test.mjs tests/site-appearance.test.mjs tests/fluid-dynamics.test.mjs tests/fluid-quality.test.mjs tests/project-studio.test.mjs tests/studio-integration.test.mjs tests/compare-lab.test.mjs tests/fluid-adaptive.test.mjs tests/marble-pattern-tools.test.mjs tests/dungeon-markers.test.mjs tests/dungeon-session-zip.test.mjs tests/dungeon-editor-integration.test.mjs tests/dungeon-terrain.test.mjs tests/music-notch.test.mjs tests/music-notch-integration.test.mjs tests/music-tonal-analysis.test.mjs tests/marble-midi-workspace.test.mjs tests/marble-midi-timing.test.mjs tests/marble-variable-tempo.test.mjs tests/marble-piano-roll.test.mjs tests/marble-piano-integration.test.mjs tests/compare-repro.test.mjs tests/compare-notebook.test.mjs tests/marble-midi-autosave.test.mjs tests/marble-midi-recovery-history.test.mjs tests/reliability-ui.test.mjs tests/compare-trial-export.test.mjs tests/compare-trial-ui.test.mjs tests/new-labs-integration.test.mjs tests/fluid-signature.test.mjs
          node --check marble-sequencer/pattern-tools.mjs
          node --check dungeon-forge/battlemap-markers.mjs
          node --check dungeon-forge/session-zip.mjs
          node --check dungeon-forge/dungeon-project.mjs
          node --check dungeon-forge/battlemap-terrain.mjs
          node --check fluid-dynamics/adaptive.mjs
          node --check fluid-dynamics/signature.mjs
          node --check compare/app.mjs
          node --check design-system/tours.mjs
          node --check design-system/recording.mjs
          node --check design-system/monitor.mjs
          node --check design-system/projects.js
          node --check design-system/rip.js
          node --check design-system/bridge.mjs
          node --check sw.js
          node --input-type=module --check < music-microscope/app.js
          node --check music-microscope/export.mjs
          node --check music-microscope/notch.mjs
          node --check music-microscope/notch-worker.mjs
          node --check music-microscope/tonal-analysis.mjs
          node --check marble-sequencer/midi-workspace.mjs
          node --check marble-sequencer/midi-autosave.mjs
          node --check marble-sequencer/midi-recovery-history.mjs
          node --check marble-sequencer/midi-timing.mjs
          node --check marble-sequencer/piano-roll.mjs
          node --check marble-sequencer/piano-roll-ui.mjs
          node --check compare/repro.mjs
          node --check compare/notebook.mjs
          node --check compare/trial-export.mjs
          node --check marble-sequencer/app.mjs
          node --check marble-sequencer/export-midi.mjs
          node --check dungeon-forge/battlemap.mjs
          node --check id-card-maker/app.mjs
          node --input-type=module --check < algorithm-arena/app.js
          node --check fluid-dynamics/app.mjs
          node --check fluid-dynamics/render.mjs
          node --check fluid-dynamics/three-surface.mjs
          node --check fluid-dynamics/quality.mjs
          node --check fluid-dynamics/dye-gpu.mjs
          node --test tests/midterm-2026.test.mjs
          node --test friends/ranked/rank-riot.test.cjs
          node --test friends/ranked/rank-riot-supabase.test.cjs
          node --test tests/device-worlds.test.mjs
          node --check device-worlds/app.mjs
          node --test tests/device-worlds-v2.test.mjs
          node --check device-worlds/signal-core.mjs
          node --check device-worlds/v2.mjs
          node --test tests/shard-fusions.test.mjs
          node --check shard-fusions/app.mjs
          node --check shard-fusions/calculator.mjs
          node --test tests/subpage-design.test.mjs
          node --test tests/deep-redesign.test.mjs
          node --test tools/words/*.node.test.mjs
          node --check tools/words/words-app.js
          node --check tools/words/dictionary-loader.js
          node --check tools/words/build-dictionary.mjs
          node --check tools/words/sw.js
          test -s tools/words/dictionaries/towers-of-babble.txt
          test -s tools/words/offline.html
          node --test tests/third-pass-redesign.test.mjs
          node --test tests/fourth-pass-redesign.test.mjs
          node --test tests/fifth-pass-redesign.test.mjs
          node --test tests/fiction-workspace.test.mjs
          node --test tests/rodion-starter.test.mjs
          node --check fiction-workspace/app.js
          node --check fiction-workspace/templates.js
          node --test tests/political-grid.test.mjs
          node --check political-grid/app.js
          node --check political-grid/overlap.js
          test -f political-grid/comparisons-schema.sql
          test -f political-grid/schema.sql
          grep -Fq 'id="fluidCanvas"' index.html
          grep -Fq 'id="projectList"' index.html
          grep -Fq 'id="searchDialog"' index.html
          grep -Fq 'href="./classic.html"' index.html
          grep -Fq 'data-archive-home' classic.html
          test -f archive/index.html
          test -f archive/archive-notice.css
          grep -Fq 'href="../vct-scout/"' archive/index.html
          grep -Fq 'href="../tideborne/"' archive/index.html
          grep -Fq 'href="../tide2/"' archive/index.html

      - name: Verify VCT comp lab and tactical planner
        run: |
          node --test vct-scout/recommendation.test.cjs
          node --test vct-scout/map-geometry.test.cjs
          node --test vct-scout/agent-tactics.test.cjs
          node --test vct-scout/recommended-plays.test.cjs
          node --test vct-scout/observed-rounds.test.cjs
          node --test vct-scout/tactical-renderer-v3.test.cjs
          node --check vct-scout/recommendation.js
          node --check vct-scout/app-core.js
          node --check vct-scout/app-lab.js
          node --check vct-scout/map-geometry.js
          node --check vct-scout/agent-tactics.js
          node --check vct-scout/recommended-plays.js
          node --check vct-scout/observed-rounds.js
          node --check vct-scout/tactical-renderer-v3.js
          grep -Fq 'Recommended Play' vct-scout/index.html
          grep -Fq 'Observed VCT Round' vct-scout/index.html
          grep -Fq 'tactical-renderer-v3.js' vct-scout/index.html
          grep -Fq 'tactical-renderer-v3.css' vct-scout/index.html
          if grep -Eq 'tactical-v2|tactical-fixes-v3' vct-scout/index.html; then
            echo 'Legacy tactical renderer is still referenced by the page'
            exit 1
          fi

      - name: Verify wheel
        run: |
          node --test wheel/*.test.mjs
          for f in wheel/*.js; do node --check "$f"; done
          grep -Fq './styles.css' wheel/index.html
          grep -Fq './app.js' wheel/index.html
          grep -Fq "p:'./wheel/'" design-system/projects.js

      - name: Refresh public VCT team logos
        run: |
          python3 scripts/update_vct_branding.py
          python3 - <<'PY'
          import json
          p=json.load(open('vct-scout/team-logos.json',encoding='utf-8'))
          print(f'Generated {len(p)} VCT team logos')
          if len(p) < 12:
              raise SystemExit('Too few team logos were resolved from VLR')
          PY

      - name: Build Tideborne fish index
        run: python3 scripts/build_tideborne_fish_index.py

      - name: Install Random Info Computer dependencies
        working-directory: computer-src
        run: npm ci

      - name: Build Random Info Computer
        working-directory: computer-src
        run: npm run build

      - name: Import and build authentic Win95 OS
        shell: pwsh
        run: ./scripts/import-henry-win95.ps1

      - name: Set up Node for Ketcher molecular editor
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - name: Build StereoLab Ketcher editor
        working-directory: chirality/ketcher-src
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -f dist/index.html
          find dist -type f | wc -l

      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'computer-src' \
            --exclude 'os-src' \
            --exclude 'chirality/ketcher-src' \
            --exclude '_computer-smoke-site' \
            ./ _site/
          mkdir -p _site/chirality/ketcher-ui
          cp -a chirality/ketcher-src/dist/. _site/chirality/ketcher-ui/
          test -f _site/chirality/ketcher-ui/index.html
          mkdir -p _site/computer
          cp -a computer-src/public/. _site/computer/
          node scripts/wire-built-appearance.mjs _site
          touch _site/.nojekyll

      - name: Download Kahoot Halloween lobby music into Rank Riot site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/friends/ranked/music
          audio="_site/friends/ranked/music/kahoot-halloween.mp3"
          url="https://kahoot.com/files/2022/10/Lobby-Music-Halloween-Edition.mp3"
          if curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 --silent --show-error "$url" -o "$audio" && [ "$(wc -c < "$audio")" -ge 50000 ]; then
            echo "Official Halloween audio downloaded to the deployed Rank Riot site ($(wc -c < "$audio") bytes)"
          else
            rm -f "$audio"
            echo "::warning::Official MP3 could not be staged; the game will stream directly from Kahoot as fallback."
          fi
          test -f _site/friends/ranked/spooky-music.js

      - name: Verify staged Random Info Computer
        run: |
          test -f _site/device-worlds/v2.mjs
          test -f _site/device-worlds/signal-core.mjs
          test -f _site/device-worlds/v2.css
          test -f _site/computer/index.html
          test -f _site/os/index.html
          test -f _site/os/doom.jsdos
          test -f _site/os/trail.jsdos
          test -f _site/os/scrabble.jsdos
          test -f _site/os/js-dos/js-dos.js
          find _site/computer -maxdepth 1 -name 'bundle.*.js' | grep -q .
          find _site/os/static/js -maxdepth 1 -name 'main.*.js' | grep -q .
          test ! -e _site/computer-src/node_modules
          test ! -e _site/os-src
          grep -Fq 'computer-fallback' _site/computer/index.html
          grep -Fq 'RANDOM INFO OS' _site/os/index.html

      - name: Chromium desktop/mobile and Firefox reliability acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --ignore-scripts --prefix /tmp/rip-browser-check playwright@1.56.1
          CHROME_BINARY="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BINARY" ]; then
            echo "No system Chrome found. Installing Playwright Chromium."
            /tmp/rip-browser-check/node_modules/.bin/playwright install chromium
          fi
          /tmp/rip-browser-check/node_modules/.bin/playwright install --with-deps firefox
          node --check scripts/browser-reliability.cjs
          NODE_PATH=/tmp/rip-browser-check/node_modules CHROME_BINARY="$CHROME_BINARY" node scripts/browser-reliability.cjs

      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" |
              jq -e --arg id "$ARTIFACT_ID" 'any(.artifacts[]; (.id | tostring) == $id and .expired == false)' > /dev/null; then
              # The Pages deployment API may lag behind Actions artifact visibility.
              # Allow its independent index to converge before deploy-pages queries it.
              sleep 30
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact was uploaded but its metadata did not become available."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check archive home
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/word-solver.html "$base/tools/words/"
          grep -Fq 'id="rackInput"' /tmp/word-solver.html
          grep -Fq 'id="palScroller"' /tmp/word-solver.html
          grep -Fq 'id="allScroller"' /tmp/word-solver.html
          grep -Fq 'words-app.js' /tmp/word-solver.html
          grep -Fq 'id="cursedScroller"' /tmp/word-solver.html
          grep -Fq 'href="./quests.html"' /tmp/word-solver.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wordfinder-enable.txt "$base/tools/words/dictionaries/towers-of-babble.txt"
          test "$(grep -c . /tmp/wordfinder-enable.txt)" -eq 195415
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wordfinder-offline.html "$base/tools/words/offline.html"
          grep -Fq 'id="embeddedDictionary"' /tmp/wordfinder-offline.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/wordfinder-sw.js "$base/tools/words/sw.js"
          grep -Fq 'cache.addAll(ASSETS)' /tmp/wordfinder-sw.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/fluid-studio.html "$base/fluid-dynamics/"
          grep -Fq 'id="display-mode"' /tmp/fluid-studio.html
          grep -Fq 'id="quality"' /tmp/fluid-studio.html
          grep -Fq 'id="tank-3d"' /tmp/fluid-studio.html
          grep -Fq 'id="tank-gpu"' /tmp/fluid-studio.html
          grep -Fq 'id="export-size"' /tmp/fluid-studio.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/projects-registry.js "$base/design-system/projects.js"
          grep -Fq 'RIPCatalog' /tmp/projects-registry.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/studio.js "$base/design-system/rip.js"
          grep -Fq 'Project studio' /tmp/studio.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/pwa-sw.js "$base/sw.js"
          grep -Fq 'offline.html' /tmp/pwa-sw.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/marble-midi.js "$base/marble-sequencer/export-midi.mjs"
          grep -Fq 'exportPatternMidi' /tmp/marble-midi.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/compare-lab.html "$base/compare/"
          grep -Fq 'id="left-frame"' /tmp/compare-lab.html
          grep -Fq 'id="right-frame"' /tmp/compare-lab.html
          grep -Fq 'id="capture-baseline"' /tmp/compare-lab.html
          grep -Fq 'id="run-trial"' /tmp/compare-lab.html
          grep -Fq 'id="run-steps"' /tmp/compare-lab.html
          grep -Fq 'id="export-trials-csv"' /tmp/compare-lab.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/compare-notebook.js "$base/compare/notebook.mjs"
          grep -Fq 'parseTrialNotebook' /tmp/compare-notebook.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/trial-export.js "$base/compare/trial-export.mjs"
          grep -Fq 'exportTrialCsv' /tmp/trial-export.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/compare-repro.js "$base/compare/repro.mjs"
          grep -Fq 'createBaseline' /tmp/compare-repro.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/compare-app.js "$base/compare/app.mjs"
          grep -Fq 'history.replaceState' /tmp/compare-app.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/guided-tours.js "$base/design-system/tours.mjs"
          grep -Fq 'startTour' /tmp/guided-tours.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/recording.js "$base/design-system/recording.mjs"
          grep -Fq 'startCanvasRecording' /tmp/recording.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/music-microscope.html "$base/music-microscope/"
          grep -Fq 'id="notchFrequency"' /tmp/music-microscope.html
          grep -Fq 'id="exportNotch"' /tmp/music-microscope.html
          grep -Fq 'id="notchCandidates"' /tmp/music-microscope.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/tonal-frequency.js "$base/music-microscope/tonal-analysis.mjs"
          grep -Fq 'detectStableTones' /tmp/tonal-frequency.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/music-notch.js "$base/music-microscope/notch.mjs"
          grep -Fq 'filterNotchPCM' /tmp/music-notch.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/music-notch-worker.js "$base/music-microscope/notch-worker.mjs"
          grep -Fq 'filterNotchPCM' /tmp/music-notch-worker.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/dungeon-editor.html "$base/dungeon-forge/"
          grep -Fq 'id="battlemapMarkerAdd"' /tmp/dungeon-editor.html
          grep -Fq 'data-battlemap-export="package"' /tmp/dungeon-editor.html
          grep -Fq 'id="battlemapTerrainDetails"' /tmp/dungeon-editor.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/dungeon-terrain.js "$base/dungeon-forge/battlemap-terrain.mjs"
          grep -Fq 'paintTerrain' /tmp/dungeon-terrain.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/dungeon-marker-module.js "$base/dungeon-forge/battlemap-markers.mjs"
          grep -Fq 'drawMarkerOverlay' /tmp/dungeon-marker-module.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/marble-studio.html "$base/marble-sequencer/"
          grep -Fq 'id="convert-to-pattern"' /tmp/marble-studio.html
          grep -Fq 'id="euclid-fill"' /tmp/marble-studio.html
          grep -Fq 'id="midi-workspace"' /tmp/marble-studio.html
          grep -Fq 'id="midi-recovery"' /tmp/marble-studio.html
          grep -Fq 'id="midi-revision"' /tmp/marble-studio.html
          grep -Fq 'id="midi-checkpoint"' /tmp/marble-studio.html
          grep -Fq 'id="midi-autosave-status"' /tmp/marble-studio.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/midi-autosave.js "$base/marble-sequencer/midi-autosave.mjs"
          grep -Fq 'createMidiDraftStore' /tmp/midi-autosave.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/midi-history.js "$base/marble-sequencer/midi-recovery-history.mjs"
          grep -Fq 'createMidiRecoveryVault' /tmp/midi-history.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/browser-reliability.html "$base/tests/browser-reliability.html"
          grep -Fq 'id="run-checks"' /tmp/browser-reliability.html
          grep -Fq 'id="verify-probe"' /tmp/browser-reliability.html
          grep -Fq 'id="piano-canvas"' /tmp/marble-studio.html
          grep -Fq 'id="piano-scroll"' /tmp/marble-studio.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/piano-roll-ui.js "$base/marble-sequencer/piano-roll-ui.mjs"
          grep -Fq 'createPianoRoll' /tmp/piano-roll-ui.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/midi-timing.js "$base/marble-sequencer/midi-timing.mjs"
          grep -Fq 'midiSecondsToTick' /tmp/midi-timing.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/multitrack.js "$base/marble-sequencer/midi-workspace.mjs"
          grep -Fq 'exportMultitrackMidi' /tmp/multitrack.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/loop-transform.js "$base/marble-sequencer/pattern-tools.mjs"
          grep -Fq 'patternFromEvents' /tmp/loop-transform.js
          grep -Fq 'id="play-both"' /tmp/compare-lab.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/fluid-surface.js "$base/fluid-dynamics/three-surface.mjs"
          grep -Fq 'getContext('\''webgl2'\''' /tmp/fluid-surface.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/fluid-dye-gpu.js "$base/fluid-dynamics/dye-gpu.mjs"
          grep -Fq 'vec4 bicubic' /tmp/fluid-dye-gpu.js
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/home.html "$base/"
          grep -Fq 'id="fluidCanvas"' /tmp/home.html
          grep -Fq 'id="projectList"' /tmp/home.html
          grep -Fq 'id="searchDialog"' /tmp/home.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/classic-home.html "$base/classic.html"
          grep -Fq 'data-archive-home' /tmp/classic-home.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/archive-home.html "$base/archive/"
          grep -Fq 'href="../tideborne/"' /tmp/archive-home.html
          grep -Fq 'href="../vct-scout/"' /tmp/archive-home.html
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/political-grid.html "$base/political-grid/"
