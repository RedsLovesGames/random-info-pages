name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify VCT comp lab and tactical planner
        run: |
          node --test vct-scout/recommendation.test.cjs
          node --test vct-scout/tactical-data.test.cjs
          node --check vct-scout/recommendation.js
          node --check vct-scout/app-core.js
          node --check vct-scout/app-lab.js
          node --check vct-scout/tactical-data.js
          node --check vct-scout/tactical-v2.js
          node --check vct-scout/tactical-fixes-v3.js
          grep -Fq 'RIB match + Replay tab' vct-scout/tactical-fixes-v3.js
          grep -Fq 'Watch exact' vct-scout/tactical-fixes-v3.js
          grep -Fq 'Site letters such as A, B, and C' vct-scout/index.html
          if grep -Fq 'Open ValoPlant replay viewer' vct-scout/index.html; then
            echo 'Generic ValoPlant source link should not be in the page shell'
            exit 1
          fi

      - name: Refresh public VCT team logos
        run: |
          python3 scripts/update_vct_branding.py
          python3 - <<'PY'
          import json
          p=json.load(open('vct-scout/team-logos.json',encoding='utf-8'))
          print(f'Generated {len(p)} VCT team logos')
          if len(p) < 12:
              raise SystemExit('Too few team logos were resolved from VLR')
          PY

      - name: Build Tideborne fish index
        run: python3 scripts/build_tideborne_fish_index.py

      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check school schedule
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/school.html "$base/school-schedule/"
          grep -Fq 'Fall 2026 School Schedule' /tmp/school.html

      - name: Check VCT tactical planner
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/vct.html "$base/vct-scout/"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/tactical-data.js "$base/vct-scout/tactical-data.js"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/tactical-v3.js "$base/vct-scout/tactical-fixes-v3.js"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/team-logos.json "$base/vct-scout/team-logos.json"
          grep -Fq 'tactical-fixes-v3.css' /tmp/vct.html
          grep -Fq 'tactical-fixes-v3.js' /tmp/vct.html
          grep -Fq 'three-lane-default' /tmp/tactical-data.js
          grep -Fq 'RIB match + Replay tab' /tmp/tactical-v3.js
          grep -Fq '"120"' /tmp/team-logos.json
