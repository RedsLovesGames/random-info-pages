name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          rm -rf _site
          mkdir -p _site/tide2
          cp index.html _site/index.html
          cp tide2/index.html _site/tide2/index.html
          cp tide2/minigame.js _site/tide2/minigame.js
          cp tide2/minigame-fix.js _site/tide2/minigame-fix.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/tide2/index.html')
          html = page.read_text()
          tags = '<script src="./minigame.js"></script>\n<script src="./minigame-fix.js"></script>'
          if '<script src="./minigame-fix.js"></script>' not in html:
              html = html.replace('</body>', tags + '\n</body>')
          page.write_text(html)
          PY
          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
