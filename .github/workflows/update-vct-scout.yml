name: Update VCT Scout Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9,21 * * *"
  push:
    paths:
      - "scripts/update_vct_scout.py"
      - "scripts/update_vct_scout_cached.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: vct-scout-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install VLR client
        run: python -m pip install "vlrdevapi>=2.3,<3"

      - name: Refresh VCT scouting snapshot
        run: python scripts/update_vct_scout_cached.py

      - name: Commit changed snapshot
        id: snapshot
        run: |
          if git diff --quiet -- vct-scout/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vct-scout/data.json
          git commit -m "Update VCT scout data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
