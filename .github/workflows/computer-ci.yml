name: Random Info Computer CI

on:
  push:
    branches: ['computer-*']
    paths:
      - 'computer-src/**'
      - 'os/**'
      - 'index.html'
      - 'tests/home-index.test.mjs'
      - 'tests/computer-*.test.mjs'
      - 'scripts/computer_browser_smoke.mjs'
      - '.github/workflows/computer-ci.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Full exact-head verification gate for the vendored 3D computer experience.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: computer-src/package-lock.json

      - name: Install pinned computer dependencies
        working-directory: computer-src
        run: npm ci

      - name: Build computer experience
        working-directory: computer-src
        run: npm run build

      - name: Run computer contracts
        run: |
          node --test tests/computer-*.test.mjs
          node --test tests/home-index.test.mjs

      - name: Run existing Pages regressions
        run: |
          node --test wheel/*.test.mjs
          for f in wheel/*.js; do node --check "$f"; done
          node --test vct-scout/recommendation.test.cjs
          node --test vct-scout/map-geometry.test.cjs
          node --test vct-scout/agent-tactics.test.cjs
          node --test vct-scout/recommended-plays.test.cjs
          node --test vct-scout/observed-rounds.test.cjs
          node --test vct-scout/tactical-renderer-v3.test.cjs
          node --check vct-scout/recommendation.js
          node --check vct-scout/app-core.js
          node --check vct-scout/app-lab.js
          node --check vct-scout/map-geometry.js
          node --check vct-scout/agent-tactics.js
          node --check vct-scout/recommended-plays.js
          node --check vct-scout/observed-rounds.js
          node --check vct-scout/tactical-renderer-v3.js
          grep -Fq 'Fall 2026 School Schedule' school-schedule/index.html

      - name: Install Chromium smoke dependency
        working-directory: computer-src
        run: |
          npm install --no-save --package-lock=false playwright@1.59.1
          npx playwright install --with-deps chromium

      - name: Stage local computer smoke site
        run: |
          rm -rf _computer-smoke-site
          mkdir -p _computer-smoke-site/computer _computer-smoke-site/os
          cp -a computer-src/public/. _computer-smoke-site/computer/
          cp -a os/. _computer-smoke-site/os/

      - name: Run Chromium computer smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _computer-smoke-site >/tmp/rip-computer-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/computer/ >/dev/null; then break; fi
            sleep 0.25
          done
          node scripts/computer_browser_smoke.mjs
