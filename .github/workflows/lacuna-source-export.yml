name: LACUNA Source Export

on:
  push:
    branches:
      - lacuna-assisted-mode
    paths:
      - '.github/workflows/lacuna-source-export.yml'
      - 'scripts/lacuna-source.part*.b64'
      - 'scripts/lacuna-hotfix/**'
      - 'scripts/import-henry-win95.ps1'
      - 'scripts/lacuna-assisted-overlay.zip'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
      - name: Expand LACUNA source
        shell: pwsh
        run: ./scripts/import-henry-win95.ps1 -SkipBuild
      - name: Upload working sources
        uses: actions/upload-artifact@v4
        with:
          name: lacuna-working-source
          path: |
            scripts/lacuna-runtime
            scripts/win95-overrides/src/arg
            scripts/import-henry-win95.ps1
            .github/workflows/lacuna-ci.yml
          if-no-files-found: error
