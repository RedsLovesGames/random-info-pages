name: Preserve OS spec and clean superseded branches

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/review-branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve Random Info OS design spec on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin random-info-os-port
          mkdir -p docs/superpowers/specs
          git show origin/random-info-os-port:docs/superpowers/specs/2026-09-26-random-info-os-full-port-design.md > docs/superpowers/specs/2026-09-26-random-info-os-full-port-design.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/specs/2026-09-26-random-info-os-full-port-design.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: preserve Random Info OS full-port design spec'
            git push origin HEAD:main
          fi

      - name: Delete superseded review branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'computer-os-cache-bust'
            'feature/wheel'
            'feature/wheel-parity-ui'
            'random-info-os-port'
            'whenwemeet-ux-3456-tests'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted $branch"
          done
