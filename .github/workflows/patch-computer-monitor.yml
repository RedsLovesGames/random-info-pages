name: Patch Random Info Computer Monitor

on:
  push:
    branches: [computer-experience]
    paths:
      - '.github/workflows/patch-computer-monitor.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: computer-experience
          fetch-depth: 0

      - name: Patch monitor iframe and message bridge
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('computer-src/src/Application/World/MonitorScreen.ts')
          src = path.read_text()

          bridge_start = "        // Bubble mouse move events to the main application, so we can affect the camera\n"
          attrs_start = "        // Set iframe attributes\n"
          before, rest = src.split(bridge_start, 1)
          _, after = rest.split(attrs_start, 1)

          bridge = '''        // Bubble iframe input events to the main application so the camera and\n        // physical mouse/keyboard audio continue to react while the CRT is focused.\n        iframe.onload = () => {\n            if (!iframe.contentWindow) return;\n\n            window.addEventListener('message', (event) => {\n                if (\n                    event.source !== iframe.contentWindow ||\n                    event.origin !== window.location.origin\n                ) {\n                    return;\n                }\n\n                const data = event.data || {};\n                const type = data.type;\n                const supportedEvents = [\n                    'mousemove',\n                    'mousedown',\n                    'mouseup',\n                    'keydown',\n                    'keyup',\n                ];\n                if (!supportedEvents.includes(type)) return;\n\n                var evt = new CustomEvent(type, {\n                    bubbles: true,\n                    cancelable: false,\n                });\n\n                // @ts-ignore\n                evt.inComputer = true;\n                if (type.startsWith('mouse')) {\n                    var clRect = iframe.getBoundingClientRect();\n                    const { top, left, width, height } = clRect;\n                    const widthRatio = width / IFRAME_SIZE.w;\n                    const heightRatio = height / IFRAME_SIZE.h;\n\n                    if (Number.isFinite(data.clientX)) {\n                        // @ts-ignore\n                        evt.clientX = Math.round(data.clientX * widthRatio + left);\n                    }\n                    if (Number.isFinite(data.clientY)) {\n                        // @ts-ignore\n                        evt.clientY = Math.round(data.clientY * heightRatio + top);\n                    }\n                } else {\n                    // @ts-ignore\n                    evt.key = data.key;\n                }\n\n                iframe.dispatchEvent(evt);\n            });\n        };\n\n'''

          # Remove the upstream production/dev iframe target block, preserving the first style line onward.
          style_marker = "        iframe.style.width = this.screenSize.width + 'px';\n"
          _, style_and_rest = after.split(style_marker, 1)
          attrs = '''        // Set iframe attributes. The OS is a same-origin sibling of /computer/.\n        iframe.src = new URL('../os/', window.location.href).href;\n''' + style_marker

          out = before + bridge_start + bridge + attrs_start + attrs + style_and_rest
          out = out.replace("iframe.title = 'HeffernanOS';", "iframe.title = 'Random Info OS';")
          path.write_text(out)

      - name: Commit monitor integration
        run: |
          git config user.name 'RedsLovesGames'
          git config user.email '75150137+RedsLovesGames@users.noreply.github.com'
          git add computer-src/src/Application/World/MonitorScreen.ts
          git commit -m 'feat: connect computer monitor to Random Info OS'
          git push origin HEAD:computer-experience
