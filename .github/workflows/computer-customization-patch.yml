name: Apply Computer Customization Patch

on:
  push:
    branches: [computer-customization]
    paths:
      - '.github/workflows/computer-customization-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: computer-customization
      - name: Apply approved identity and launcher customization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          loading = Path('computer-src/src/Application/UI/components/LoadingScreen.tsx')
          text = loading.read_text()
          replacements = {
              """                            <div>\n                                <p style={styles.green}>\n                                    <b>Heffernan,</b>{' '}\n                                </p>\n                                <p style={styles.green}>\n                                    <b>Henry Inc.</b>\n                                </p>\n                            </div>""": """                            <div>\n                                <p style={styles.green}>\n                                    <b>RANDOM INFO SYSTEMS</b>{' '}\n                                </p>\n                                <p style={styles.green}>\n                                    <b>ARCHIVE TERMINAL 26</b>\n                                </p>\n                            </div>""",
              '<p>Released: 01/13/2000</p>': '<p>Released: 09/26/2026</p>',
              '<p>HHBIOS (C)2000 Heffernan Henry Inc.,</p>': '<p>RIP BIOS (C)2026 RANDOM INFO SYSTEMS</p>',
              '<p>HSP S13 2000-2022 Special UC131S</p>': '<p>RIP/26 ARCHIVE COMPUTER · CRT GATEWAY</p>',
              '<p>HSP Showcase(tm) XX 113</p>': '<p>Random Info Pages Archive(tm) 26</p>',
              "'Henry Heffernan Portfolio Showcase'": "'Random Info Pages Archive'",
              '<p>Henry Heffernan Portfolio Showcase 2022</p>': '<p>Random Info Computer · Archive Terminal 26</p>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing LoadingScreen source pattern: {old[:80]!r}')
              text = text.replace(old, new)
          loading.write_text(text)

          home = Path('index.html')
          html = home.read_text()
          old_link = '<a class="computer-entry" href="./computer/">ENTER ARCHIVE COMPUTER <span aria-hidden="true">→</span></a>'
          new_link = '<a class="computer-entry win95-computer-button" href="./computer/"><span class="win95-computer-icon" aria-hidden="true"><i></i></span><span>Random Info Computer</span></a>'
          if old_link not in html:
              raise SystemExit('missing existing archive computer link')
          html = html.replace(old_link, new_link)

          win95_css = '''.win95-computer-button{display:inline-flex!important;width:max-content!important;align-items:center!important;gap:9px!important;margin-top:25px!important;padding:8px 13px!important;border:2px solid!important;border-color:#fff #000 #000 #fff!important;border-radius:0!important;background:#c0c0c0!important;color:#000!important;box-shadow:inset 1px 1px #dfdfdf,inset -1px -1px #808080,2px 2px 0 rgba(0,0,0,.35)!important;font:700 13px/1 "MS Sans Serif",Tahoma,Arial,sans-serif!important;letter-spacing:0!important;text-transform:none!important;text-shadow:none!important;text-decoration:none!important;transition:none!important}.win95-computer-button:hover,.win95-computer-button:focus-visible{color:#000!important;gap:9px!important;outline:1px dotted #000;outline-offset:-5px}.win95-computer-button:active{border-color:#000 #fff #fff #000!important;box-shadow:inset 1px 1px #808080!important;transform:translate(1px,1px)}.win95-computer-icon{position:relative;display:inline-block;width:23px;height:20px;flex:0 0 23px}.win95-computer-icon:before{content:"";position:absolute;left:1px;top:0;width:19px;height:14px;background:#1b1b1b;border:3px solid #d8d8d8;box-shadow:1px 1px #555,-1px -1px #fff}.win95-computer-icon:after{content:"";position:absolute;left:8px;bottom:0;width:10px;height:3px;background:#808080;box-shadow:0 -3px #c0c0c0}.win95-computer-icon i{position:absolute;z-index:1;left:5px;top:4px;width:13px;height:7px;background:linear-gradient(135deg,#000080,#3e9697)}'''
          if win95_css not in html:
              html = html.replace('</style>', win95_css + '</style>', 1)
          home.write_text(html)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add computer-src/src/Application/UI/components/LoadingScreen.tsx index.html
          git commit -m "feat: rebrand computer intro and add Win95 launcher"
          git push origin HEAD:computer-customization
