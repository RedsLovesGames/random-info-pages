name: One-time merged branch cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'chatgpt/henry-win95-port'
            'computer-customization'
            'computer-experience'
            'computer-henry-win95-port'
            'computer-rip-window-fix'
            'deploy/oldasspolitic'
            'feature/archive-home'
            'feature/full-member-pages'
            'feature/member-finance-profiles'
            'feature/search-and-corp-sponsors'
            'feature/sponsor-insights-crunch'
            'feature/track-aipac-data'
            'fix/default-company-lists'
            'fix/fec-bulk-sponsor-data'
            'fix/member-bulk-dashboard'
            'fix/sponsor-smoke-and-build'
            'fix/track-aipac-deploy-check'
            'fix-whenwemeet-cross-device'
            'temp-fish-enhancements'
            'toolbox'
            'toolbox-step4-temp'
            'toolbox-step4-tests'
            'toolbox-step4-tests2'
            'whenwemeet-deploy'
            'whenwemeet-deploy2'
            'whenwemeet-deploy3'
            'whenwemeet-final'
            'whenwemeet-final2'
            'whenwemeet-ux-3456-work'
            'whenwemeet-ux-3456'
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            if gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"; then
              echo "Deleted $branch"
            else
              echo "Failed to delete $branch" >&2
              exit 1
            fi
          done
