<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d13"><meta name="description" content="Simple customizable random name wheel."><title>Wheel · Random Info Pages</title><link rel="stylesheet" href="./styles.css"></head><body>
<header class="top"><div class="brand"><div class="mark">R</div><span>Wheel</span></div><div class="actions"><button class="btn secondary" id="saveBtn">Save</button><button class="btn secondary" id="shareBtn">Share</button><button class="btn secondary" id="presentBtn">Present</button><button class="btn" id="settingsBtn">Settings</button></div></header>
<main class="app"><section class="wheelpane"><div class="tabs" id="wheelTabs"></div><div class="wheelwrap"><canvas id="wheel" width="700" height="700" aria-label="Random selection wheel"></canvas></div><div class="spinrow"><button class="btn primary" id="spinBtn">Spin</button></div><div class="status" id="status" aria-live="polite"></div></section>
<aside class="editor"><div class="editorhead"><h2>Entries</h2><button class="btn" id="addBtn">+ Add</button></div><div class="entrytools"><button class="btn" id="shuffleBtn">Shuffle</button><button class="btn" id="sortBtn">Sort</button><button class="btn" id="clearBtn">Clear</button></div><div class="entries" id="entries"></div><p class="hint">Paste multiple lines into any name field to add them all. Weight 1 is normal; larger numbers make an entry more likely.</p><div class="history"><strong>Recent winners</strong><ul id="history"></ul></div></aside></main>
<div class="modal hidden" id="winnerModal" role="dialog" aria-modal="true" aria-labelledby="winnerTitle"><div class="panel winner"><div class="hint" id="winnerTitle">Winner</div><div class="name" id="winnerName"></div><div class="row"><button class="btn primary" id="againBtn">Spin again</button><button class="btn" id="removeWinnerBtn">Remove winner</button><button class="btn" id="removeMatchesBtn">Remove all matches</button><button class="btn" id="closeWinnerBtn">Keep</button></div></div></div>
<div class="sheet hidden" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="panel"><h2 id="settingsTitle">Settings</h2><div class="grid2"><div class="field"><label>Spin duration</label><input id="durationInput" type="range" min="500" max="12000" step="250"></div><div class="field"><label>Theme</label><select id="themeSelect"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="field"><label>Sound</label><select id="soundSelect"><option value="true">On</option><option value="false">Off</option></select></div><div class="field"><label>Confetti</label><select id="confettiSelect"><option value="true">On</option><option value="false">Off</option></select></div></div><hr style="border-color:var(--line);border-style:solid;border-width:1px 0 0;margin:18px 0"><div class="row"><button class="btn" id="newWheelBtn">New wheel</button><button class="btn" id="duplicateWheelBtn">Duplicate wheel</button><button class="btn danger" id="deleteWheelBtn">Delete wheel</button></div><div class="row" style="margin-top:10px"><button class="btn" id="exportBtn">Export JSON</button><label class="btn" for="importInput">Import JSON</label><input class="hidden" id="importInput" type="file" accept="application/json,.json"><button class="btn" id="fullscreenBtn">Fullscreen</button></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn primary" id="closeSettingsBtn">Done</button></div></div></div>
<div class="sheet hidden" id="saveSheet" role="dialog" aria-modal="true"><div class="panel"><h2>Saved wheels</h2><div class="row"><input id="saveName" placeholder="Save name" style="flex:1;background:#0d131d;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:10px"><button class="btn primary" id="saveNamedBtn">Save</button></div><div id="savedList" style="margin-top:14px"></div><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="closeSaveBtn">Close</button></div></div></div>
<script type="module" src="./app.js"></script></body></html>
