<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>StereoLab Chemistry Editor</title><style>html,body{margin:0;height:100%;background:white;font:14px system-ui}#root{height:100%}#bootstatus{position:fixed;z-index:100000;inset:0;display:grid;place-items:center;text-align:center;white-space:pre-wrap;padding:25px;background:white;color:#445068;font:600 15px/1.5 system-ui}</style></head><body><div id="root"></div><div id="bootstatus" role="status">Loading full molecular editor…</div><script>(function(){function fail(kind,msg){var el=document.getElementById('bootstatus');if(el){el.textContent='Ketcher '+kind+': '+msg;el.style.color='#aa3333'}if(window.parent!==window)window.parent.postMessage({source:'stereolab-ketcher',eventType:'error',message:kind+': '+msg},location.origin);}window.addEventListener('error',function(e){fail('script error',String(e.message||e.error||'unknown error'))});window.addEventListener('unhandledrejection',function(e){fail('startup rejection',String(e.reason||'unknown error'))});window.setTimeout(function(){var el=document.getElementById('bootstatus');if(el&&window.ketcher===undefined&&el.textContent.includes('Loading'))el.textContent='The Ketcher editor is taking longer to initialize. If this persists, use basic drawing mode in StereoLab.';},16000);})();</script><script type="module" src="./src/main.jsx"></script></body></html>
