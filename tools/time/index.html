<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0a"><title>Time Zone Board · Toolbox</title><link rel="stylesheet" href="../shared/toolbox.css"><style>.time-head{padding:44px 0 24px}.time-head h1{margin:8px 0 10px;font-size:clamp(3rem,9vw,7rem);line-height:.82;letter-spacing:-.07em;text-transform:uppercase}.time-head p{margin:0;color:var(--muted);max-width:650px}.control{border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0 18px;background:var(--ink2)}.control-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}.range{width:100%;accent-color:var(--acid)}.button,.select,.input{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#0e0e0d;color:var(--paper);padding:0 12px}.button{cursor:pointer}.button.primary{background:var(--acid);color:var(--ink);border-color:var(--acid);font-weight:800}.slider-meta{display:flex;justify-content:space-between;margin-top:10px;color:var(--muted);font:700 .61rem var(--mono);text-transform:uppercase}.clocks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.clock{border:1px solid var(--line);border-radius:16px;padding:20px;min-height:205px;display:flex;flex-direction:column}.clock.ref{border-color:rgba(217,255,98,.55)}.clock-top{display:flex;justify-content:space-between;gap:10px}.clock-name{font-size:1.05rem;font-weight:800}.clock-zone{color:var(--muted);font:600 .61rem var(--mono)}.clock-time{margin:auto 0 2px;font-size:clamp(3rem,7vw,6rem);font-weight:800;letter-spacing:-.07em;line-height:.85}.clock-date{color:#c5c2b9}.clock-bottom{display:flex;justify-content:space-between;gap:10px;margin-top:14px;color:var(--muted);font:700 .6rem var(--mono);text-transform:uppercase}.clock-actions{display:flex;gap:6px}.icon{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;min-width:34px;height:34px;cursor:pointer}.add{margin:18px 0 70px;border-top:1px solid var(--line);padding-top:18px}.add-grid{display:grid;grid-template-columns:1fr 1.3fr auto;gap:10px}.notice{color:var(--muted);font-size:.72rem;margin:10px 0}.error{color:#ff9d8f}@media(max-width:720px){.control-row,.add-grid{grid-template-columns:1fr}.clocks{grid-template-columns:1fr}.clock{min-height:185px}.time-head{padding-top:32px}}</style></head><body><header class="tb-top"><nav class="tb-shell tb-nav"><a class="tb-brand" href="../">RIP/26 · TOOLBOX</a><a class="tb-back" href="../">← All tools</a></nav></header><main class="tb-shell"><section class="time-head"><div class="tb-kicker">01 / Time · stored on this device</div><h1>Time Zone Board</h1><p>Name the people or places you care about, then move one shared instant and every clock follows. DST is calculated from the selected date and zone.</p></section><section class="control"><div class="control-row"><input id="slider" class="range" type="range" min="-168" max="168" step="1" value="0" aria-label="Hours from now"><button id="now" class="button primary" type="button">Now</button><button id="format" class="button" type="button">12 hour</button></div><div class="slider-meta"><span id="offsetLabel">Now</span><span>± 7 days</span></div></section><section id="clocks" class="clocks" aria-live="polite"></section><section class="add"><form id="addForm" class="add-grid"><input id="name" class="input" maxlength="28" placeholder="Name, e.g. Alex" required><input id="zone" class="input" list="zones" placeholder="IANA zone, e.g. America/New_York" required><datalist id="zones"></datalist><button class="button primary" type="submit">Add clock</button></form><p id="message" class="notice">Up to 16 clocks. Your board never leaves this browser.</p></section></main><script type="module">import{loadState,saveState,zoneParts,dayDifference,shiftedNow,uid,validZone,commonZones}from'./time.js';let state=loadState();const clocks=document.querySelector('#clocks'),slider=document.querySelector('#slider'),offsetLabel=document.querySelector('#offsetLabel'),format=document.querySelector('#format'),message=document.querySelector('#message'),zones=document.querySelector('#zones');commonZones.forEach(z=>{const o=document.createElement('option');o.value=z;zones.append(o)});slider.value=state.offsetHours;function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const date=shiftedNow(+state.offsetHours),ref=state.clocks.find(c=>c.id===state.referenceId)||state.clocks[0];offsetLabel.textContent=+state.offsetHours===0?'Now':`${+state.offsetHours>0?'+':''}${state.offsetHours} hours`;format.textContent=state.format24?'24 hour':'12 hour';clocks.innerHTML=state.clocks.map(c=>{try{const p=zoneParts(date,c.zone,state.format24),d=dayDifference(date,c.zone,ref.zone),day=d===0?'Same day':d>0?`+${d} day${d===1?'':'s'}`:`${d} day${d===-1?'':'s'}`;return`<article class="clock ${c.id===ref.id?'ref':''}"><div class="clock-top"><div><div class="clock-name">${esc(c.name)}</div><div class="clock-zone">${esc(c.zone)}</div></div><div class="clock-actions"><button class="icon" data-ref="${c.id}" title="Use as reference" aria-label="Use ${esc(c.name)} as reference">◎</button>${state.clocks.length>1?`<button class="icon" data-remove="${c.id}" title="Remove" aria-label="Remove ${esc(c.name)}">×</button>`:''}</div></div><div class="clock-time">${p.hour}:${p.minute}${state.format24?'':` <small style="font-size:.25em;letter-spacing:0">${p.dayPeriod||''}</small>`}</div><div class="clock-date">${p.weekday}, ${p.month} ${p.day}</div><div class="clock-bottom"><span>${p.timeZoneName||''}</span><span>${day}</span></div></article>`}catch(e){return`<article class="clock"><div class="error">${esc(e.message)}</div></article>`}}).join('');saveState(state)}slider.addEventListener('input',()=>{state.offsetHours=+slider.value;render()});document.querySelector('#now').addEventListener('click',()=>{state.offsetHours=0;slider.value=0;render()});format.addEventListener('click',()=>{state.format24=!state.format24;render()});clocks.addEventListener('click',e=>{const r=e.target.closest('[data-ref]'),x=e.target.closest('[data-remove]');if(r){state.referenceId=r.dataset.ref;render()}if(x){state.clocks=state.clocks.filter(c=>c.id!==x.dataset.remove);if(state.referenceId===x.dataset.remove)state.referenceId=state.clocks[0].id;render()}});document.querySelector('#addForm').addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#name'),zone=document.querySelector('#zone');message.classList.remove('error');if(state.clocks.length>=16){message.textContent='Clock limit reached.';message.classList.add('error');return}if(!validZone(zone.value.trim())){message.textContent='That time zone is not supported. Use an IANA zone such as America/New_York.';message.classList.add('error');return}state.clocks.push({id:uid(),name:name.value.trim(),zone:zone.value.trim()});name.value='';zone.value='';message.textContent='Clock added. Saved locally.';render()});render();setInterval(()=>{if(+state.offsetHours===0)render()},30000);</script></body></html>
