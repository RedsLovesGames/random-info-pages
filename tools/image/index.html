<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Studio · Toolbox</title><link rel="stylesheet" href="../shared/toolbox.css"><style>
main{max-width:1120px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.drop{margin:24px 0;border:1px dashed #7b8494;border-radius:18px;padding:34px;text-align:center;cursor:pointer}.drop.drag{background:#f1f3f5}.workspace{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:18px}.panel{border:1px solid #dfe3e8;border-radius:18px;padding:18px;background:#fff}.preview{min-height:420px;display:grid;place-items:center;background:#f5f6f7;border-radius:12px;overflow:hidden}.preview img{max-width:100%;max-height:65vh;object-fit:contain}.controls{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:.82rem;font-weight:700;display:grid;gap:6px}input,select,button{font:inherit;padding:10px 12px;border:1px solid #cfd5dc;border-radius:10px;background:#fff}button{cursor:pointer;font-weight:700}.primary{background:#111;color:#fff;border-color:#111}.meta{font-size:.86rem;color:#68717d}.queue{display:grid;gap:8px;margin-top:16px}.file{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #eceff2}.privacy{font-size:.8rem;color:#59636f}@media(max-width:760px){.workspace{grid-template-columns:1fr}.preview{min-height:280px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main><div class="top"><div><a href="../">← Toolbox</a><h1>Image Studio</h1><p class="meta">Convert, resize and compress images without uploading them.</p></div><span class="privacy">LOCAL PROCESSING</span></div>
<input id="picker" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><div id="drop" class="drop" tabindex="0"><strong>Drop images here</strong><div class="meta">or tap to choose PNG, JPEG or WebP files</div></div>
<section class="workspace"><div class="panel"><div class="preview" id="preview"><span class="meta">Choose an image to preview it.</span></div><div id="queue" class="queue"></div></div><aside class="panel controls"><label>Output format<select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label><div class="row"><label>Width<input id="width" type="number" min="1"></label><label>Height<input id="height" type="number" min="1"></label></div><label><span><input id="lock" type="checkbox" checked> Lock aspect ratio</span></label><label>Scale<select id="scale"><option value="custom">Custom</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option></select></label><label id="qualityWrap">Quality <input id="quality" type="range" min="10" max="100" value="86"><span id="qualityValue" class="meta">86%</span></label><button id="process" class="primary" disabled>Process selected</button><a id="download" hidden>Download result</a><div id="status" class="meta"></div></aside></section></main><script src="image-core.js"></script><script>
const $=s=>document.querySelector(s),picker=$('#picker'),drop=$('#drop'),preview=$('#preview'),queue=$('#queue'),format=$('#format'),width=$('#width'),height=$('#height'),lock=$('#lock'),scale=$('#scale'),quality=$('#quality'),qualityValue=$('#qualityValue'),process=$('#process'),download=$('#download'),status=$('#status');let files=[],active=null,sourceURL=null,resultURL=null,ratio=1;
function bytes(n){if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}
function cleanup(url){if(url)URL.revokeObjectURL(url)}
async function loadFile(file){active=file;cleanup(sourceURL);sourceURL=URL.createObjectURL(file);const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=sourceURL});ratio=img.naturalWidth/img.naturalHeight;width.value=img.naturalWidth;height.value=img.naturalHeight;preview.innerHTML='';preview.append(img);process.disabled=false;status.textContent=`${img.naturalWidth} × ${img.naturalHeight} · ${bytes(file.size)} · ${file.type}`;renderQueue()}
function renderQueue(){queue.innerHTML='';files.forEach(f=>{const r=document.createElement('div');r.className='file';r.innerHTML=`<button type="button">${f.name}</button><span class="meta">${bytes(f.size)}</span>`;r.querySelector('button').onclick=()=>loadFile(f);queue.append(r)})}
function add(list){const good=[...list].filter(f=>['image/png','image/jpeg','image/webp'].includes(f.type));files.push(...good);if(good.length&&!active)loadFile(good[0]);renderQueue();if(!good.length)status.textContent='No supported PNG, JPEG or WebP images found.'}
drop.onclick=()=>picker.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();picker.click()}};picker.onchange=()=>add(picker.files);['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>add(e.dataTransfer.files));
width.oninput=()=>{if(lock.checked&&+width.value>0)height.value=Math.max(1,Math.round(+width.value/ratio))};height.oninput=()=>{if(lock.checked&&+height.value>0)width.value=Math.max(1,Math.round(+height.value*ratio))};scale.onchange=()=>{if(!active||scale.value==='custom')return;const img=preview.querySelector('img');const d=ImageCore.resizeByPercent(img.naturalWidth,img.naturalHeight,+scale.value);width.value=d.width;height.value=d.height};quality.oninput=()=>qualityValue.textContent=quality.value+'%';format.onchange=()=>$('#qualityWrap').hidden=format.value==='image/png';
process.onclick=async()=>{if(!active)return;try{const w=+width.value,h=+height.value;if(w<=0||h<=0)throw new Error('Width and height must be positive.');process.disabled=true;status.textContent='Processing locally…';const bitmap=await createImageBitmap(active);const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:true});ctx.drawImage(bitmap,0,0,w,h);bitmap.close?.();const blob=await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(new Error('This browser could not encode that format.')),format.value,+quality.value/100));cleanup(resultURL);resultURL=URL.createObjectURL(blob);const ext=format.value.split('/')[1].replace('jpeg','jpg');download.href=resultURL;download.download=(active.name.replace(/\.[^.]+$/,'')||'image')+'.'+ext;download.textContent=`Download ${ext.toUpperCase()} · ${bytes(blob.size)}`;download.hidden=false;status.textContent=`Done · ${w} × ${h} · ${bytes(blob.size)} (${Math.round((1-blob.size/active.size)*100)}% ${blob.size<=active.size?'smaller':'larger'})`}catch(e){status.textContent=e.message}finally{process.disabled=false}};window.addEventListener('beforeunload',()=>{cleanup(sourceURL);cleanup(resultURL)});
</script></body></html>
