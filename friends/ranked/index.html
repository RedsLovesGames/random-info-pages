<header class="masthead"><a class="brand" href="../" aria-label="Friend Group Hub">R<span>★</span>RIOT</a><div class="header-actions"><span class="status-dot" id="connectionStatus">OFFLINE</span><button type="button" class="icon-button" id="soundButton" title="Toggle sounds" aria-label="Toggle sounds">♪</button></div></header>
<main id="app" aria-live="polite"><section class="shell"><div class="eyebrow">LIVE PARTY GAME / RANKED CHOICE</div><h1 class="display">RANK<br><i>RIOT.</i></h1><p class="lead">Loading...</p></section></main>
<footer class="site-footer"><a href="../">← Friend Group Hub</a><span>Made for Alex &amp; Doron · 25 questions each · 3 / 2 / 1 points</span></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* Rank Riot: original Kahoot-style ranked-choice live game UI.
 * Hosted as static files; real multiplayer state and Sheets import live in Code.gs.
 * No third-party libraries or Google Sheets credentials in the client.
 */
(() => {
  'use strict';
  const PEOPLE = ['Tommy','Mike','Jack','Ethan','Rita','Nora','Alex','Doron'];
  const $ = (selector) => document.querySelector(selector);
  const app = $('#app');
  const toast = $('#toast');
  const storage = window.localStorage;
  const params = new URLSearchParams(window.location.search);
  const ENDPOINT = 'https://bpudsyyepiminpdxlquz.supabase.co/functions/v1/rank-riot';
  const state = {view:'home',secret:storage.getItem('rank-riot-host-key') || '',pin:params.get('pin') || '',
    playerKey:'',name:'',snapshot:null,setup:null,rank:[],requesting:false,loading:false,lastStage:'',sound:storage.getItem('rank-riot-sound') !== 'off',networkError:false,historyData:null,savedResult:null};
  if(state.pin && !/^\d{6}$/.test(state.pin)) state.pin='';
  if(state.pin) state.view='join';
  const esc = (value) => String(value==null?'':value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function beep(pitch=660){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),osc=ac.createOscillator(),gain=ac.createGain();osc.type='triangle';osc.frequency.value=pitch;gain.gain.setValueAtTime(.035,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.0005,ac.currentTime+.16);osc.connect(gain).connect(ac.destination);osc.start();osc.stop(ac.currentTime+.17);setTimeout(()=>ac.close(),260);}catch{}}
  function notify(message,error=false){toast.textContent=message;toast.className='toast visible'+(error?' error':'');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.className='toast',4400);}
  function updateConnection(ok){$('#connectionStatus').textContent=ok?'CONNECTED':'OFFLINE';$('#connectionStatus').classList.toggle('online',ok);}
  function joinUrl(){const u=new URL(window.location.href);u.search='';u.searchParams.set('pin',state.pin);return u.toString();}
  function roomKey(pin,name){return 'rank-riot-player-'+pin+'-'+name;}
  async function rpc(action,payload={}){
    const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),15000);
    try{
      const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...payload}),signal:controller.signal,cache:'no-store'});
      const json=await res.json();
      if(!res.ok || !json.ok) throw new Error(json?.error||'Game server unavailable.');
      updateConnection(true);return json.data;
    }catch(err){updateConnection(false);if(err.name==='AbortError')throw new Error('Server timed out. Try again.');throw err;}
    finally{clearTimeout(timeout);}
  }
  function header(title,subtitle=''){return `<div class="eyebrow">${esc(subtitle)}</div><h1 class="subhead">${esc(title)}</h1>`;}
  function button(label,action,cls='btn',extra=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
  function home(){return `<section class="shell hero-grid"><div><div class="eyebrow">THE ALEX + DORON EDITION / 2026</div><h1 class="display">RANK<br><i>RIOT.</i></h1><p class="lead">Six anonymous answers each round. Three ranked votes. One brutally competitive leaderboard. Your friends wrote the answers. You decide who wins.</p><div class="button-row">${button('JOIN A GAME ↗','view-join')}${button('HOST A GAME ↗','view-setup','btn alt')}${button('PAST GAMES ↗','history','btn ghost')}</div><p class="tiny" style="margin-top:30px">50 ORIGINAL PROMPTS · ALEX / DORON / DOUBLE FEATURE · LIVE ON EVERY PHONE</p></div><div class="orbit" aria-hidden="true"><strong>3<span style="color:white">/</span>2<span style="color:white">/</span>1</strong></div></section>`;}
  function setupView(){
    const stats=state.setup;
    return `<section class="shell"><div class="meta-row"><div>${header('Host control room','MISSION CONTROL / SUPABASE')}</div>${button('← BACK','view-home','btn ghost small')}</div>
      <div class="two-col"><div class="panel stack"><div class="eyebrow">HOST SIGN-IN</div>
      <p class="copy">Supabase is connected directly. Enter your private host key once on this device. Players never need it.</p>
      <div class="field"><label for="hostPass">Host access key</label><input id="hostPass" type="password" autocomplete="off" value="${esc(state.secret)}" placeholder="Enter your private host key"></div>
      ${button('VERIFY HOST ACCESS','inspect')}

  function gameView(){const s=state.snapshot;if(!s)return `<section class="shell"><h1 class="subhead">Connecting to room…</h1></section>`;switch(s.stage){case'lobby':return lobby(s);case'question':return question(s);case'reveal':return reveal(s);case'leaderboard':return boardView(s);case'skipped':return skipped(s);case'finished':return finalView(s);default:return '<div>Unknown room state.</div>';}}

  function render(){if(state.view==='home')app.innerHTML=home();else if(state.view==='setup')app.innerHTML=setupView();else if(state.view==='join')app.innerHTML=joinView();else if(state.view==='history')app.innerHTML=historyView();else if(state.view==='saved-result')app.innerHTML=resultView();else app.innerHTML=gameView();updateTimer();}
  function updateTimer(){const s=state.snapshot;if(!s||s.stage!=='question')return;const remaining=Math.max(0, s.closesAt - (Date.now()- (state.clientClockSkew||0)));
    const timerEl=$('#countdown'),bar=$('#timerFill');if(timerEl){timerEl.textContent=String(Math.ceil(remaining/1000));timerEl.classList.toggle('low',remaining<10000);}if(bar)bar.style.width=Math.max(0,Math.min(100,remaining/(s.seconds*1000)*100))+'%';
  }

  async function poll(force=false){if(!['host','player'].includes(state.view)||!state.pin||state.requesting)return;

  function fieldValue(id){return ($('#'+id)?.value||'').trim();}
  async function act(action,target){switch(action){

    case 'history':{
      const secret=fieldValue('hostPass')||state.secret;

      const history=await rpc('history',{secret,limit:20,offset:0});

    case 'vote':{
      if(state.rank.length!==3||state.snapshot?.voted)return;
      await rpc('vote',{pin:state.pin,playerKey:state.playerKey,picks:state.rank});await poll(true);notify('Your top three were recorded.');return;
    }
    case 'copy-link':{await copy(joinUrl());return;}
    case 'copy-pin':{await copy(state.pin);return;}
  }}
  async function copy(content){try{await navigator.clipboard.writeText(content);notify('Copied to clipboard.');}catch{notify('Copy unavailable. Select the join URL from the address bar.',true);}}
  app.addEventListener('click',async event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;try{target.disabled=true;await act(action,target);}catch(err){notify(err.message,true);}finally{if(target.isConnected)target.disabled=false;}});
  app.addEventListener('change',event=>{
    if(event.target?.id!=='savedQuestionJump')return;
    const index=Number(event.target.value);
    if(!Number.isInteger(index))return;
    const selected=document.getElementById('saved-round-'+index);
    if(selected)selected.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
  });
  $('#soundButton').addEventListener('click',()=>{state.sound=!state.sound;storage.setItem('rank-riot-sound',state.sound?'on':'off');$('#soundButton').textContent=state.sound?'♪':'×';if(state.sound)beep();});
  $('#soundButton').textContent=state.sound?'♪':'×';
  // Room join links carry only the public PIN. The host key is never included.
  render();rpc('ping').catch(()=>{});setInterval(()=>{poll(false);updateTimer();},1850);setInterval(updateTimer,150);
})();

</script>
</body>
</html>
