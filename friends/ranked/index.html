<!doctype html>
<html lang="en">
<head>

<title>Rank Riot | Live Friend Group Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#131029;--bg2:#1b1538;--panel:#211b42;--panel2:#302553;--text:#fff9fc;--muted:#b4aacc;--stroke:rgba(255,255,255,.16);--green:#cbff4d;--pink:#ff6da9;--orange:#ffbb56;--blue:#7dd9ff;--violet:#ad98ff;--font:'Space Grotesk',system-ui,sans-serif;--mono:'DM Mono',monospace}

.noise{position:fixed;inset:0;pointer-events:none;opacity:.09;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}
a{color:inherit}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed;transform:none!important}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:3px}button,input,select{touch-action:manipulation}.masthead{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1500px;margin:auto;padding:24px clamp(20px,4vw,58px)}.brand{font-weight:700;font-size:1.5rem;letter-spacing:-.09em;text-decoration:none}.brand span{color:var(--green);padding:0 3px}.header-actions{display:flex;align-items:center;gap:18px}.status-dot{font:500 .67rem var(--mono);letter-spacing:.09em;color:var(--muted)}.status-dot:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--pink)}.status-dot.online:before{background:var(--green);box-shadow:0 0 14px var(--green)}.icon-button{border:1px solid var(--stroke);border-radius:100px;background:var(--panel);color:var(--text);width:43px;height:43px;font-size:1.6rem}.shell{width:min(1380px,calc(100% - 36px));margin:auto;padding:38px 12px 110px}.eyebrow{font:500 .74rem var(--mono);letter-spacing:.18em;color:var(--green);text-transform:uppercase}.display{margin:16px 0;line-height:.8;letter-spacing:-.095em;font-size:clamp(6rem,15vw,15rem);font-weight:700}.display i{font-style:normal;color:var(--green)}.lead{color:var(--muted);line-height:1.55;font-size:clamp(1.03rem,1.6vw,1.35rem);max-width:650px}.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:40px;align-items:center;min-height:570px}.orbit{width:min(100%,460px);aspect-ratio:1;border:2px solid var(--stroke);border-radius:50%;position:relative;display:grid;place-items:center;margin:auto;background:radial-gradient(circle,#3a2a65,transparent 65%);box-shadow:0 0 90px #2a2f6c66}.orbit:before,.orbit:after{content:'';position:absolute;inset:14%;border:2px dashed #b4aacc66;border-radius:50%;animation:spin 25s linear infinite}.orbit:after{inset:28%;border-color:var(--pink);animation-direction:reverse;animation-duration:17s}.orbit strong{font-size:clamp(6rem,13vw,11rem);line-height:1;color:var(--green);text-shadow:8px 8px var(--pink);transform:rotate(-11deg)}@keyframes spin{to{transform:rotate(360deg)}}
.button-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.btn{border:0;border-radius:13px;background:var(--green);color:#17112e;padding:15px 23px;min-height:50px;font-weight:700;letter-spacing:-.02em;box-shadow:0 8px 0 #a0bb3590;transition:transform .15s,box-shadow .15s;text-align:center}.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 11px 0 #a0bb3590}.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 4px 0 #a0bb3590}.btn.alt{background:var(--pink);box-shadow:0 8px 0 #b1488190}.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;color:var(--text);border:1px solid var(--stroke)}.btn.dark{background:#21163e;color:var(--text);box-shadow:none}.btn.small{padding:10px 14px;min-height:36px;font-size:.87rem}.btn.full{width:100%}.btn.danger{background:#f87171;box-shadow:0 7px 0 #a84949}
.panel{background:linear-gradient(135deg,#29224d,#201936);border:1px solid var(--stroke);border-radius:25px;padding:clamp(18px,3vw,32px);box-shadow:0 18px 55px #08061944}.stack{display:grid;gap:19px}.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.three-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.subhead{font-size:clamp(2rem,4.5vw,4rem);line-height:1.02;letter-spacing:-.065em;margin:15px 0 24px}.copy{color:var(--muted);font-size:1rem;line-height:1.6}.field{display:grid;gap:8px}.field label{font:500 .75rem var(--mono);color:var(--green);letter-spacing:.05em;text-transform:uppercase}.field input,.field select{color:var(--text);background:#120f27;border:1px solid #655c83;border-radius:12px;padding:15px 14px;min-height:52px;width:100%;outline:none}.field select option{background:#15122b}.field input:focus,.field select:focus{border-color:var(--green)}.narrow{max-width:620px;margin:auto}.center{text-align:center}.mono{font-family:var(--mono)}.tiny{color:var(--muted);font:.77rem/1.5 var(--mono)}.rule{border:0;border-top:1px solid var(--stroke);margin:28px 0}.ready{color:var(--green)}.warning{color:var(--orange)}.bad{color:#ff9cb2}.pin{font-weight:700;font-size:clamp(5rem,15vw,12rem);line-height:1;letter-spacing:.08em;color:var(--green);text-align:center;font-variant-numeric:tabular-nums;margin:18px 0 24px}.player-chips{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}.chip{padding:11px 18px;border:1px solid var(--stroke);border-radius:999px;background:#352b56;font-weight:700}.chip:before{content:'●';color:var(--green);margin-right:8px}.divider-line{height:1px;background:var(--stroke);margin:22px 0}.meta-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.pill{border:1px solid var(--stroke);border-radius:40px;background:#292144;padding:8px 14px;font:.77rem var(--mono)}.round-title{font-size:clamp(2.3rem,5.4vw,5.7rem);letter-spacing:-.065em;line-height:1.03;margin:17px 0 32px;max-width:1180px;text-wrap:balance}.round-header{display:flex;align-items:center;gap:22px;justify-content:space-between;flex-wrap:wrap}.countdown{font:bold clamp(3rem,7vw,6rem) var(--mono);color:var(--green);font-variant-numeric:tabular-nums}.countdown.low{color:var(--pink);animation:pulse .7s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}.timer-track{width:100%;height:11px;border-radius:10px;background:#ffffff27;margin:20px 0 35px;overflow:hidden}.timer-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--pink),var(--green));transition:width .13s linear}.answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.answer{position:relative;min-height:136px;border:2px solid transparent;border-radius:20px;padding:22px 22px 48px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:var(--c);color:#17112b;font-weight:700;font-size:clamp(1rem,1.7vw,1.3rem);line-height:1.27;overflow-wrap:anywhere;box-shadow:0 9px 0 #07061250;transition:transform .15s,box-shadow .15s,border-color .15s}.answer:nth-child(1){--c:#ff729f}.answer:nth-child(2){--c:#7bdcff}.answer:nth-child(3){--c:#cbff4d}.answer:nth-child(4){--c:#ffbd6e}.answer:nth-child(5){--c:#c2a7ff}.answer:nth-child(6){--c:#a2f0da}.answer.clickable:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 13px 0 #07061250}.answer.selected{border-color:#fff;outline:3px solid #fff5;transform:translateY(-4px)}.answer.mine{opacity:.43;cursor:not-allowed}.answer .number{position:absolute;bottom:13px;left:16px;font:700 .7rem var(--mono);opacity:.62}.answer .rank{position:absolute;top:10px;right:11px;background:#21163e;color:#fff;padding:6px 10px;border-radius:100px;font:.78rem var(--mono)}.answer .author{position:absolute;bottom:12px;right:15px;font:.78rem var(--mono)}.answer .points{position:absolute;bottom:10px;left:15px;font:700 .9rem var(--mono)}.answer .win{position:absolute;top:10px;left:13px;font:.76rem var(--mono);background:#21163e;color:#fff;border-radius:20px;padding:5px 9px}.answer:disabled{pointer-events:none}.rank-summary{padding:20px;background:#1d1739;border:1px solid var(--stroke);border-radius:20px;display:grid;gap:10px}.rank-line{display:flex;gap:10px;align-items:center;font-size:.94rem}.rank-line b{color:var(--green);font-family:var(--mono);width:48px}.rank-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vote-footer{position:sticky;bottom:10px;z-index:10;margin-top:22px;padding:14px;background:#211936ee;backdrop-filter:blur(18px);border:1px solid var(--stroke);border-radius:17px;display:flex;gap:12px;align-items:center;justify-content:space-between}.scoreboard{display:grid;gap:9px}.score-row{display:grid;grid-template-columns:43px 130px minmax(0,1fr) auto;align-items:center;gap:16px;border:1px solid var(--stroke);background:#1d1739;border-radius:16px;padding:13px 18px}.score-row:first-child{background:#374428;border-color:#9dc63f}.score-rank{font:700 1.7rem var(--mono);color:var(--green)}.score-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score-bar{height:13px;background:#ffffff20;border-radius:10px;overflow:hidden}.score-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--green));border-radius:10px;min-width:2px;animation:growth .65s both}@keyframes growth{from{width:0}}.score-value{font:700 .9rem var(--mono);white-space:nowrap}.score-sub{grid-column:2 / -1;font:.72rem var(--mono);color:var(--muted)}.badge-stat{font:.72rem var(--mono);color:var(--muted)}.mapping{display:grid;grid-template-columns:1fr minmax(130px,200px);gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--stroke)}.mapping:last-child{border:0}.mapping select{border-radius:10px;padding:10px;background:#120f27;border:1px solid var(--stroke);color:var(--text);width:100%}.mapping strong{font-size:.85rem}.mapping small{display:block;color:var(--muted);font-size:.7rem;margin-top:2px;overflow-wrap:anywhere}.tag{display:inline-block;padding:5px 10px;background:#373052;border-radius:7px;font:.74rem var(--mono)}.empty{border:2px dashed #aa8bc370;border-radius:16px;padding:23px;color:var(--muted);line-height:1.6}.toast{position:fixed;bottom:28px;left:50%;z-index:40;background:#fff5ec;color:#251840;transform:translate(-50%,30px);padding:14px 20px;border-radius:12px;font-weight:700;box-shadow:0 8px 30px #0007;opacity:0;pointer-events:none;transition:.25s;max-width:min(500px,calc(100% - 32px))}.toast.visible{opacity:1;transform:translate(-50%,0)}.toast.error{background:#ff87a8}.site-footer{position:relative;margin:auto;width:min(1380px,calc(100% - 36px));border-top:1px solid var(--stroke);padding:24px 6px 32px;color:var(--muted);display:flex;gap:18px;justify-content:space-between;font:.77rem var(--mono)}.site-footer a{text-decoration:none}.site-footer a:hover{color:var(--green)}.reveal-hero{color:var(--green);font-weight:700;font-size:clamp(2.5rem,6vw,5.5rem);letter-spacing:-.07em;line-height:1;margin:14px 0}.flair{font-size:4rem;display:inline-block;animation:bounce .65s ease both}@keyframes bounce{0%{transform:scale(.2) rotate(-25deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}.confetti{position:fixed;width:10px;height:16px;z-index:15;pointer-events:none;top:-20px;animation:fall var(--duration,2.3s) linear forwards;left:var(--left,50%);background:var(--color,var(--green));transform:rotate(var(--angle,20deg))}@keyframes fall{to{top:110vh;transform:translateX(var(--drift,50px)) rotate(720deg);opacity:.1}}
@media(max-width:850px){.hero-grid{grid-template-columns:1fr;min-height:auto}.orbit{max-width:280px;order:-1}.orbit strong{font-size:6rem}.display{font-size:clamp(5.5rem,21vw,9rem)}.three-col{grid-template-columns:1fr}.two-col{grid-template-columns:1fr}.answer-grid{grid-template-columns:1fr}.answer{min-height:104px;font-size:1.03rem;padding:19px 15px 39px}.score-row{grid-template-columns:30px 86px minmax(0,1fr) auto;gap:8px;padding:12px}.score-value{font-size:.8rem}.site-footer{flex-wrap:wrap}.shell{padding-top:24px;padding-bottom:68px}.masthead{padding:15px 20px}}

<body>
<div class="noise" aria-hidden="true"></div>
<header class="masthead"><a class="brand" href="../" aria-label="Friend Group Hub">R<span>★</span>RIOT</a><div class="header-actions"><span class="status-dot" id="connectionStatus">OFFLINE</span><button type="button" class="icon-button" id="soundButton" title="Toggle sounds" aria-label="Toggle sounds">♪</button></div></header>
<main id="app" aria-live="polite"><section class="shell"><div class="eyebrow">LIVE PARTY GAME / RANKED CHOICE</div><h1 class="display">RANK<br><i>RIOT.</i></h1><p class="lead">Loading...</p></section></main>
<footer class="site-footer"><a href="../">← Friend Group Hub</a><span>Made for Alex &amp; Doron · 25 questions each · 3 / 2 / 1 points</span></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* Rank Riot: original Kahoot-style ranked-choice live game UI.
 * Hosted as static files; real multiplayer state and Sheets import live in Code.gs.
 * No third-party libraries or Google Sheets credentials in the client.
 */
(() => {
  'use strict';
  const PEOPLE = ['Tommy','Mike','Jack','Ethan','Rita','Nora'];
  const $ = (selector) => document.querySelector(selector);
  const app = $('#app');
  const toast = $('#toast');
  const storage = window.localStorage;
  const params = new URLSearchParams(window.location.search);
  const urlServer = params.get('server') || '';
  const state = {view:'home',server:validServer(urlServer) ? urlServer : (storage.getItem('rank-riot-server') || ''),secret:sessionStorage.getItem('rank-riot-host') || '',
    pin:params.get('pin') || '',playerKey:'',name:'',snapshot:null,setup:null,rank:[],requesting:false,loading:false,lastStage:'',sound:storage.getItem('rank-riot-sound') !== 'off',networkError:false};
  if(validServer(state.server)) storage.setItem('rank-riot-server',state.server);
  if(state.pin && !/^\d{6}$/.test(state.pin)) state.pin='';
  if(state.pin) state.view='join';
  const esc = (value) => String(value==null?'':value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function validServerFn(url){return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(String(url||'').trim());}
  // Resolve before first use; supports typed URLs containing harmless query strings.
  function validServer(url){return validServerFn(url);}
  function beep(pitch=660){if(!state.sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ac=new AC(),osc=ac.createOscillator(),gain=ac.createGain();osc.type='triangle';osc.frequency.value=pitch;gain.gain.setValueAtTime(.035,ac.currentTime);gain.gain.exponentialRampToValueAtTime(.0005,ac.currentTime+.16);osc.connect(gain).connect(ac.destination);osc.start();osc.stop(ac.currentTime+.17);setTimeout(()=>ac.close(),260);}catch{}}
  function notify(message,error=false){toast.textContent=message;toast.className='toast visible'+(error?' error':'');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.className='toast',4400);}
  function updateConnection(ok){$('#connectionStatus').textContent=ok?'CONNECTED':'OFFLINE';$('#connectionStatus').classList.toggle('online',ok);}
  function joinUrl(){const u=new URL(window.location.href);u.search='';u.searchParams.set('server',state.server);u.searchParams.set('pin',state.pin);return u.toString();}
  function roomKey(pin,name){return 'rank-riot-player-'+pin+'-'+name;}
  function rpc(action,payload={}){
    if(!validServer(state.server))return Promise.reject(new Error('Connect the Google Apps Script Web App URL first.'));
    return new Promise((resolve,reject)=>{
      const key='rankCb_'+Math.random().toString(36).slice(2,13);const script=document.createElement('script');let settled=false;
      const done=(error,response)=>{if(settled)return;settled=true;clearTimeout(timeout);script.remove();delete window[key];if(error){updateConnection(false);reject(error);}else{updateConnection(true);resolve(response);}};
      const timeout=setTimeout(()=>done(new Error('Server timed out. Confirm the web app is deployed with Anyone access.')),25000);
      window[key]=(response)=>{if(!response || !response.ok)done(new Error(response?.error||'The game server returned an error.'));else done(null,response.data);};
      const endpoint=new URL(state.server);endpoint.searchParams.set('callback',key);
      endpoint.searchParams.set('payload',JSON.stringify({action,...payload}));
      script.onerror=()=>done(new Error('Could not reach the Apps Script server. Confirm the /exec URL and deployment access.'));
      script.src=endpoint.toString();document.head.appendChild(script);
    });
  }
  function header(title,subtitle=''){return `<div class="eyebrow">${esc(subtitle)}</div><h1 class="subhead">${esc(title)}</h1>`;}
  function button(label,action,cls='btn',extra=''){return `<button type="button" class="${cls}" data-action="${action}" ${extra}>${label}</button>`;}
  function home(){return `<section class="shell hero-grid"><div><div class="eyebrow">THE ALEX + DORON EDITION / 2026</div><h1 class="display">RANK<br><i>RIOT.</i></h1><p class="lead">Six anonymous answers. Three ranked votes. One brutally competitive leaderboard. Your friends wrote the answers. You decide who wins.</p><div class="button-row">${button('JOIN A GAME ↗','view-join')}${button('HOST A GAME ↗','view-setup','btn alt')}</div><p class="tiny" style="margin-top:30px">50 ORIGINAL PROMPTS · ALEX / DORON / DOUBLE FEATURE · LIVE ON EVERY PHONE</p></div><div class="orbit" aria-hidden="true"><strong>3<span style="color:white">/</span>2<span style="color:white">/</span>1</strong></div></section>`;}
  function serverField(){return `<div class="field"><label for="serverUrl">Google Apps Script server URL</label><input id="serverUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(state.server)}"><div class="tiny">One-time setup: deploy the included Code.gs as a Google Apps Script Web App. Your sheet stays private in your Google account.</div></div>`;}
  function setupView(){
    let sections='';
    if(state.setup){sections=['alex','doron'].map(g=>{
      const data=state.setup.games[g];const ready=data.perQuestion.filter(x=>x>=4).length;
      return `<section class="panel stack" data-form="${g}"><div class="meta-row"><div><div class="eyebrow">${g.toUpperCase()} / ANSWER SOURCE</div><h3 style="margin:9px 0;font-size:1.7rem">${data.tab?esc(data.tab):'Response tab missing'}</h3></div><span class="tag ${ready===25?'ready':'warning'}">${ready}/25 playable</span></div><p class="copy">${data.responses.length} response rows found. Assign every submitted row to its author. Nobody can vote for their own response. Empty questions can be skipped by the host.</p>${data.responses.length?`<div class="mapping-list">${data.responses.map(r=>`<div class="mapping"><div><strong>Row ${r.row}</strong><small>${esc(r.identifier)} · ${r.filled}/25 answers</small></div><select aria-label="Author of row ${r.row}" data-row="${r.row}" data-game="${g}"><option value="">Unassigned</option>${PEOPLE.map(name=>`<option value="${name}" ${(data.mapping[r.row]||r.suggestedName)===name?'selected':''}>${name}</option>`).join('')}</select></div>`).join('')}</div>${button('Save '+g+' author assignments','save-map','btn small',`data-game="${g}"`)}`:`<div class="empty">No linked response rows. Open the Google Form → Responses → Link to Sheets → use the connected workbook. If it already uses another spreadsheet, edit RR_SHEET_ID in Code.gs.</div>`}</section>`;
    }).join('');
    }
    return `<section class="shell"><div class="meta-row"><div>${header('Host control room','MISSION CONTROL / SETUP')}</div>${button('← BACK','view-home','btn ghost small')}</div><div class="two-col"><div class="panel stack">${serverField()}<div class="field"><label for="hostPass">Host passphrase</label><input id="hostPass" type="password" value="${esc(state.secret)}" placeholder="From installRankRiot() execution log"></div><div class="button-row">${button('Connect & inspect sheets','inspect')}${button('Copy source sheet link','sheet-link','btn ghost')}</div><p class="tiny">The host passphrase is never shown to players. If you have not initialized the script, run installRankRiot() once in the Apps Script editor.</p></div><div class="panel stack"><div class="eyebrow">NEW GAME</div><div class="field"><label for="gameMode">Game</label><select id="gameMode"><option value="alex">Alex · 25 questions</option><option value="doron">Doron · 25 questions</option><option value="both">Double feature · 50 questions</option></select></div><div class="field"><label for="duration">Voting time per question</label><select id="duration"><option value="30">30 seconds</option><option value="45" selected>45 seconds</option><option value="60">60 seconds</option><option value="90">90 seconds</option></select></div>${button('Create live room ↗','create','btn full')}<p class="tiny">Scores belong to answer writers, not voters. 1st/2nd/3rd receive 3/2/1 points; ranked averages determine the winner.</p></div></div>${state.setup?`<h2 style="margin-top:50px">Response mapping</h2><div class="two-col">${sections}</div>`:`<div class="panel" style="margin-top:20px"><div class="eyebrow">LIVE DATA REQUIREMENTS</div><p class="copy">The linked tracker currently has no Alex or Doron response tabs. Once actual Google Form responses are linked, this screen detects all 25 question headers and lets you map the six rows to Tommy, Mike, Jack, Ethan, Rita and Nora.</p><a href="https://docs.google.com/spreadsheets/d/1ZIs8vwnnIAy-rEU8QsGXRBSZ7BoudigjYU9v00-d5iY/edit" target="_blank" rel="noopener noreferrer">Open connected responses workbook ↗</a></div>`}</section>`;
  }
  function joinView(){return `<section class="shell narrow"><div class="meta-row">${header('Enter the arena','JOIN / LIVE GAME')}${button('← HOME','view-home','btn ghost small')}</div><div class="panel stack">${state.server?'':serverField()}<div class="field"><label for="pinInput">Six-digit game PIN</label><input id="pinInput" inputmode="numeric" maxlength="6" pattern="[0-9]*" autocomplete="off" style="font-size:2.8rem;font-family:var(--mono);text-align:center;letter-spacing:.13em" value="${esc(state.pin)}" placeholder="000000"></div><div class="field"><label for="playerName">Which response is yours?</label><select id="playerName"><option value="">Choose your name</option>${PEOPLE.map(name=>`<option ${state.name===name?'selected':''}>${name}</option>`).join('')}</select></div>${button('JOIN ROOM ↗','join','btn full')}<p class="tiny">You will see everyone’s answers, but you cannot rank your own. Pick your favorite three in order.</p></div></section>`;}
  function hostActions(s){if(s.stage==='lobby')return button('START GAME ↗','advance');if(s.stage==='question')return button('REVEAL ANSWERS EARLY ↗','advance','btn alt');if(s.stage==='reveal')return button('SHOW LEADERBOARD ↗','advance');if(s.stage==='leaderboard'||s.stage==='skipped')return button(s.questionIndex===s.count-1?'FINISH GAME ↗':'NEXT QUESTION ↗','advance');return button('NEW GAME','view-setup');}
  function lobby(s){return `<section class="shell center"><div class="eyebrow">ROOM IS LIVE / ${esc(s.mode.toUpperCase())}</div><h1 class="subhead" style="margin-top:23px">Join at <span style="color:var(--green)">Rank Riot</span></h1><p class="copy">Share the link or ask everyone to enter this code.</p><div class="pin">${esc(s.pin)}</div><div class="button-row" style="justify-content:center">${button('COPY JOIN LINK','copy-link','btn ghost')}${button('COPY PIN','copy-pin','btn ghost')}</div><h2 style="margin:50px 0 20px">Players in room <span style="color:var(--green)">${s.players.length}/6</span></h2><div class="player-chips">${s.players.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div><p class="tiny" style="margin-top:21px">${s.players.length===0?'Waiting for the first player…':'Waiting for everyone to join…'}</p>${state.view==='host'?`<div style="margin-top:38px">${hostActions(s)}</div>`:'<div class="flair" aria-hidden="true" style="margin-top:44px">✳</div>'}</section>`;}
  function timer(s){return `<div class="round-header"><div class="pill">${esc(s.game.toUpperCase())} / Q ${s.number} OF 25</div><div class="countdown" id="countdown">${Math.ceil(s.seconds)}</div></div><div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>`;}
  function answerCards(s){return `<div class="answer-grid">${s.options.map((o,i)=>{
    const rank=state.rank.indexOf(o.id),isPlayer=state.view==='player' && s.stage==='question',canVote=isPlayer&&!o.mine&&!s.voted;
    const ranking=rank>=0?`<span class="rank">${['1ST','2ND','3RD'][rank]} ★</span>`:'';
    const tally=s.stage==='reveal'?`<span class="points">${o.tally.sum} pts · ${o.tally.first} gold</span><span class="author">${esc(o.author)}</span>`:'';
    return `<button type="button" class="answer ${canVote?'clickable':''} ${o.mine&&isPlayer?'mine':''} ${rank>=0?'selected':''}" data-action="pick" data-id="${esc(o.id)}" ${canVote?'':'disabled'}>${s.stage==='reveal'?`<span class="win">${i+1}</span>`:''}<span>${esc(o.text)}</span>${ranking}${tally}<span class="number">${o.mine&&isPlayer?'YOUR ANSWER':'ANSWER '+(i+1)}</span></button>`;
  }).join('')}</div>`;}
  function rankingFooter(s){return `<div class="vote-footer"><div><div class="eyebrow">YOUR RANKINGS</div><div class="tiny">${state.rank.length}/3 selected · ${state.rank.length===3?'Ready to submit':'Tap any three answers in order'}</div></div>${button(s.voted?'VOTE LOCKED ✓':'LOCK IN MY TOP 3 ↗','vote','btn',`id="voteButton" ${state.rank.length!==3||s.voted?'disabled':''}`)}</div>`;}
  function question(s){return `<section class="shell"><div class="meta-row"><span class="eyebrow">LIVE ROUND / ${esc(s.game.toUpperCase())}</span><span class="pill" id="voteCount">${s.voteCount}/${s.players.length} votes received</span></div><h1 class="round-title">${esc(s.question)}</h1>${timer(s)}${answerCards(s)}${state.view==='player'?(s.voted?`<div class="panel center" style="margin-top:20px"><div class="flair">✓</div><h2>VOTE RECEIVED</h2><p class="copy">Waiting for the results. You can’t change your selection after submitting.</p></div>`:rankingFooter(s)):`<div class="meta-row" style="margin-top:27px"><p class="tiny">Players are ranking their top three answers on their own phones.</p>${hostActions(s)}</div>`}</section>`;}
  function skipped(s){return `<section class="shell center narrow"><div class="eyebrow">${esc(s.game.toUpperCase())} / QUESTION ${s.number}</div><h1 class="subhead">Not enough answers</h1><p class="copy">This question has fewer than four assigned, nonempty responses. The round is not scored.</p>${state.view==='host'?hostActions(s):'<p class="tiny">Waiting for the host to continue.</p>'}</section>`;}
  function reveal(s){const sorted=[...s.options].sort((a,b)=>b.tally.sum-a.tally.sum || b.tally.first-a.tally.first);const first=sorted[0];return `<section class="shell"><div class="eyebrow">${esc(s.game.toUpperCase())} / QUESTION ${s.number} · ANSWER REVEAL</div><h1 class="reveal-hero"><span class="flair">✹</span> THE RESULTS ARE IN.</h1><p class="copy">Top choice: <strong style="color:var(--green)">${esc(first?.author||'No votes')}</strong> · ${first?.tally.sum||0} points. Writers get the points, not the people voting.</p><h2 class="subhead" style="font-size:2rem;margin-top:35px">${esc(s.question)}</h2><div class="answer-grid">${sorted.map((o,i)=>`<article class="answer" style="min-height:165px;--c:${['#cbff4d','#7bdcff','#ff729f','#ffbd6e','#c2a7ff','#a2f0da'][i%6]}"><span class="win">#${i+1}</span><span>${esc(o.text)}</span><span class="points">${o.tally.sum} pts · ${o.tally.first} first / ${o.tally.second} second / ${o.tally.third} third</span><span class="author">By ${esc(o.author)}</span></article>`).join('')}</div><div style="margin-top:28px;text-align:center">${state.view==='host'?hostActions(s):'<p class="tiny">Waiting for leaderboard…</p>'}</div></section>`;}
  function scoresBoard(scores){const top=Math.max(1,...scores.map(s=>s.average));return `<div class="scoreboard">${scores.map((p,i)=>`<div class="score-row"><div class="score-rank">${i+1}</div><div class="score-name">${esc(p.name)}</div><div class="score-bar"><span style="width:${Math.max(0,p.average/top*100).toFixed(2)}%"></span></div><div class="score-value">${p.average.toFixed(2)} avg</div><div class="score-sub">${p.sum} total · ${p.rounds} scored rounds · ${p.first} first-place votes</div></div>`).join('')}</div>`;}
  function boardView(s){return `<section class="shell"><div class="eyebrow">RANKINGS / AFTER ${esc(s.game.toUpperCase())} QUESTION ${s.number}</div><h1 class="subhead">THE LEADERBOARD<span style="color:var(--green)">.</span></h1><p class="copy">Ranked by average points per authored answer, with first-place votes breaking ties.</p>${scoresBoard(s.leaderboard)}<div class="center" style="margin-top:30px">${state.view==='host'?hostActions(s):'<p class="copy">Next round starting when the host is ready…</p>'}</div></section>`;}
  function finalView(s){const win=s.leaderboard[0];return `<section class="shell"><div class="center"><div class="eyebrow">COMPETITION COMPLETE / ${esc(s.mode.toUpperCase())}</div><div class="flair" style="font-size:7rem">★</div><h1 class="reveal-hero" style="font-size:clamp(3.4rem,8vw,8rem)">${esc(win.name)} WINS.</h1><p class="lead" style="margin:auto">${win.average.toFixed(2)} average points per answer. The crowd has spoken.</p></div><h2 class="subhead" style="margin-top:55px">Final standings</h2>${scoresBoard(s.leaderboard)}${s.mode==='both'?`<div class="two-col" style="margin-top:30px"><div class="panel"><h2>Alex champion: ${esc(s.byGame.alex[0].name)}</h2>${scoresBoard(s.byGame.alex)}</div><div class="panel"><h2>Doron champion: ${esc(s.byGame.doron[0].name)}</h2>${scoresBoard(s.byGame.doron)}</div></div>`:''}<div class="center" style="margin-top:30px">${state.view==='host'?button('PLAY AGAIN ↗','view-setup'):button('BACK TO HOME','view-home')}</div></section>`;}
  function gameView(){const s=state.snapshot;if(!s)return `<section class="shell"><h1 class="subhead">Connecting to room…</h1></section>`;switch(s.stage){case'lobby':return lobby(s);case'question':return question(s);case'reveal':return reveal(s);case'leaderboard':return boardView(s);case'skipped':return skipped(s);case'finished':return finalView(s);default:return '<div>Unknown room state.</div>';}}
  function render(){if(state.view==='home')app.innerHTML=home();else if(state.view==='setup')app.innerHTML=setupView();else if(state.view==='join')app.innerHTML=joinView();else app.innerHTML=gameView();updateTimer();}
  function updateTimer(){const s=state.snapshot;if(!s||s.stage!=='question')return;const remaining=Math.max(0, s.closesAt - (Date.now()- (state.clientClockSkew||0)));
    const timerEl=$('#countdown'),bar=$('#timerFill');if(timerEl){timerEl.textContent=String(Math.ceil(remaining/1000));timerEl.classList.toggle('low',remaining<10000);}if(bar)bar.style.width=Math.max(0,Math.min(100,remaining/(s.seconds*1000)*100))+'%';
  }
  function onSnapshot(snapshot){state.clientClockSkew=Date.now()-snapshot.serverNow;const last=state.snapshot;const stageChanged=last?.stage!==snapshot.stage || last?.questionIndex!==snapshot.questionIndex;
    if(last?.questionIndex!==snapshot.questionIndex)state.rank=[];
    state.snapshot=snapshot;
    if(stageChanged){beep(snapshot.stage==='reveal'?880:520);if(snapshot.stage==='finished')confetti();}
    if(!last || stageChanged || JSON.stringify({...last,serverNow:0})!==JSON.stringify({...snapshot,serverNow:0}))render();
    else updateTimer();
  }
  function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<65;i++){const e=document.createElement('span');e.className='confetti';e.style.setProperty('--left',Math.random()*100+'vw');e.style.setProperty('--duration',(1.4+Math.random()*2.5)+'s');e.style.setProperty('--drift',(Math.random()-.5)*280+'px');e.style.setProperty('--color',['#cbff4d','#ff729f','#7bdcff','#ffbd6e','#c2a7ff'][i%5]);document.body.append(e);setTimeout(()=>e.remove(),4400);}}
  async function poll(force=false){if(!['host','player'].includes(state.view)||!state.pin||state.requesting)return;if(!validServer(state.server))return;
    state.requesting=true;try{const snapshot=await rpc('state',{pin:state.pin,secret:state.view==='host'?state.secret:'',playerKey:state.view==='player'?state.playerKey:''});state.networkError=false;onSnapshot(snapshot);}catch(err){if(!state.networkError||force)notify(err.message,true);state.networkError=true;}finally{state.requesting=false;}
  }
  function fieldValue(id){return ($('#'+id)?.value||'').trim();}
  function saveServer(){const url=fieldValue('serverUrl')||state.server;if(!validServer(url))throw new Error('Enter the deployed Apps Script /exec URL, not its editor link.');state.server=url;storage.setItem('rank-riot-server',url);}
  async function act(action,target){switch(action){
    case 'view-home':state.view='home';state.snapshot=null;render();return;
    case 'view-join':state.view='join';render();return;
    case 'view-setup':state.view='setup';state.snapshot=null;render();return;
    case 'sheet-link':window.open('https://docs.google.com/spreadsheets/d/1ZIs8vwnnIAy-rEU8QsGXRBSZ7BoudigjYU9v00-d5iY/edit','_blank','noopener');return;
    case 'inspect':{
      saveServer();state.secret=fieldValue('hostPass');sessionStorage.setItem('rank-riot-host',state.secret);
      state.setup=await rpc('setup',{secret:state.secret});render();notify('Sheets inspected. Assign each row to its author.');return;
    }
    case 'save-map':{
      const game=target.dataset.game,assignments=[...document.querySelectorAll(`select[data-game="${game}"]`)].map(el=>({row:Number(el.dataset.row),name:el.value}));
      state.setup=await rpc('saveMap',{secret:state.secret,game,assignments});render();notify(game.toUpperCase()+' assignments saved.');return;
    }
    case 'create':{
      if(!state.secret)throw new Error('Enter and connect your host passphrase first.');
      const response=await rpc('create',{secret:state.secret,game:fieldValue('gameMode'),seconds:Number(fieldValue('duration'))});
      state.pin=response.pin;state.view='host';state.rank=[];await poll(true);notify('Room '+state.pin+' is open.');return;
    }
    case 'join':{
      if(!state.server)saveServer();
      const pin=fieldValue('pinInput'),name=fieldValue('playerName');
      if(!/^\d{6}$/.test(pin))throw new Error('Enter a six-digit PIN.');
      if(!PEOPLE.includes(name))throw new Error('Choose your name.');
      const current=storage.getItem(roomKey(pin,name))||'';
      const joined=await rpc('join',{pin,name,playerKey:current});
      state.pin=joined.pin;state.name=joined.name;state.playerKey=joined.playerKey;storage.setItem(roomKey(pin,name),joined.playerKey);
      state.view='player';await poll(true);return;
    }
    case 'advance':{
      if(state.view!=='host')return;
      await rpc('advance',{pin:state.pin,secret:state.secret});await poll(true);return;
    }
    case 'pick':{
      if(state.view!=='player'||state.snapshot?.stage!=='question'||state.snapshot.voted)return;
      const id=target.dataset.id, option=state.snapshot.options.find(o=>o.id===id);
      if(!option||option.mine)return;
      if(state.rank.includes(id))state.rank=state.rank.filter(n=>n!==id);
      else if(state.rank.length<3)state.rank.push(id);
      else{state.rank.shift();state.rank.push(id);}
      beep(400+state.rank.length*160);render();return;
    }
    case 'vote':{
      if(state.rank.length!==3||state.snapshot?.voted)return;
      await rpc('vote',{pin:state.pin,playerKey:state.playerKey,picks:state.rank});await poll(true);notify('Your top three were recorded.');return;
    }
    case 'copy-link':{await copy(joinUrl());return;}
    case 'copy-pin':{await copy(state.pin);return;}
  }}
  async function copy(content){try{await navigator.clipboard.writeText(content);notify('Copied to clipboard.');}catch{notify('Copy unavailable. Select the join URL from the address bar.',true);}}
  app.addEventListener('click',async event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;try{target.disabled=true;await act(action,target);}catch(err){notify(err.message,true);}finally{if(target.isConnected)target.disabled=false;}});
  $('#soundButton').addEventListener('click',()=>{state.sound=!state.sound;storage.setItem('rank-riot-sound',state.sound?'on':'off');$('#soundButton').textContent=state.sound?'♪':'×';if(state.sound)beep();});
  $('#soundButton').textContent=state.sound?'♪':'×';
  // A room link joins with its server URL encoded; no player needs to configure anything.
  render();setInterval(()=>{poll(false);updateTimer();},1850);setInterval(updateTimer,150);
})();

</script>
</body>
